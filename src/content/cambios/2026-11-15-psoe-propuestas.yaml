tipo: "propuestas"
descripcion: "Añadimos 55 propuestas de su programa. En vivienda: el 1 % del PIB, 100.000 viviendas públicas estatales, un impuesto a las viviendas de grandes propietarios y fondos que no se alquilen a precio asequible, la congelación de alquileres por encima del índice de referencia y un recargo municipal a las pernoctaciones turísticas. En fiscalidad: el IRPF de las rentas del capital hasta el 35 %, la tasa Tobin al 0,4 % y tasas a los viajes de lujo y a las grandes tecnológicas. En empleo: el SMI por encima del 60 % del salario medio y la jornada de 37,5 horas. También sanidad (7 % del PIB, Plan Sonríe, psicólogo en 30 días), educación, energía, pensiones, cuidados (prestación por crianza, unión de amistad), igualdad, financiación autonómica, seguridad y política exterior."
