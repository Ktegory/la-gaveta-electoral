descripcion: "Publicó el 12 de noviembre su programa completo para el 29N (66 págs., 115 medidas numeradas). Pasa a ser la fuente principal de sus propuestas: hemos cotejado con él las 29 que ya teníamos y citamos la página. Cambian algunos títulos para ajustarse a su texto (por ejemplo, en sanidad la excepción para los inmigrantes en situación irregular pasa de «urgencia vital» a «urgencia grave»). El programa promete bajar el IRPF, el IVA y el Impuesto de Sociedades, pero sin las cifras de su programa económico de 2025; esas propuestas, y las de pensiones y Ley de Cambio Climático, no aparecen así en el programa y quedan aparte, con su fuente."
