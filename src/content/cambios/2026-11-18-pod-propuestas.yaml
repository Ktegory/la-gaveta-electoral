fecha: "2026-11-18"
partido: "pod"
tipo: "propuestas"
descripcion: "Añadimos la propuesta que Podemos publicó el 18 de noviembre en Instagram: reconocer derechos de cuidados a las familias elegidas y a las relaciones no monógamas. Con el programa publicado ese mismo día, añadimos 69 propuestas más. En vivienda: alquiler indefinido, prohibir los pisos turísticos y los desahucios sin alternativa, una inmobiliaria pública con renta máxima del 30 % de la renta media del municipio y el fin del régimen de las SOCIMI, la dación en pago y un tope al interés de las hipotecas variables. En fiscalidad: tipo mínimo del 19 % en Sociedades (29 % para los oligopolios), IRPF estatal del 9 % al 28,5 %, impuesto permanente a las grandes fortunas e IVA del 21 % en los pisos turísticos. En empleo y pensiones: despido ilegal de 45 días con opción de readmisión, nuevo Estatuto de los Trabajadores, sin tope de cotización y sin penalizar la jubilación anticipada con 40 años cotizados. También cuidados (permiso por nacimiento de 26 semanas, prestación por crianza hasta los 21 años), migraciones, sanidad, educación, energía y clima, transporte (gratuito, y sin vuelos cortos con tren de menos de tres horas), Constitución (referéndum sobre monarquía o república, voto a los 16), justicia, seguridad y política exterior."
