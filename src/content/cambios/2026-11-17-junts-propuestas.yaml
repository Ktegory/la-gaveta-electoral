descripcion: "Añadimos dos propuestas que Miriam Nogueras defendió el 16 de noviembre en un desayuno de Amics del País en Barcelona, según la crónica de Europa Press: eliminar el impuesto de Sucesiones y Donaciones y agilizar los expedientes de expulsión de migrantes en situación irregular. También añadimos el compromiso «El català, cosa de tots», que Nogueras propuso el 17 de noviembre a los cabezas de lista en Cataluña para usar siempre el catalán en el Congreso."
