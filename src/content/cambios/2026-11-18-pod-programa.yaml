descripcion: "Publica su programa para el 29N, «Así de básico: paz, casa y trabajo» (141 páginas, 6 capítulos), y pasa de «pendiente» a «publicado». Es la fuente principal de sus propuestas: hemos cotejado con él las 21 que ya teníamos y citamos la página. El salario mínimo de 1.800 € se alcanzaría en una legislatura y lo que iría por ley es un suelo del 75 % del salario mediano; el impuesto del 50 % a los beneficios extraordinarios es para la gran banca, no para el IBEX; el de las empresas contaminantes va del 7 al 15 % de sus beneficios; el permiso parental retribuido es de 10 semanas por progenitor, no de 8; los 1.000 millones contra las violencias machistas son un fondo de contingencia; la pensión mínima contributiva se iguala al SMI y la no contributiva al 80 %. No aparece en el programa la contratación de 40.000 profesionales sanitarios, ni las cifras de 24.000 millones de gasto militar y 9.100 millones para Repsol: quedan con su fuente anterior."
