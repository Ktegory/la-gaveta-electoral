fecha: "2026-11-24"
partido: "junts"
tipo: "propuestas"
descripcion: "Con el programa publicado el 18 de noviembre, añadimos 82 propuestas de Junts, en el orden del programa. Es un programa largo, con unos 600 puntos: recogemos las medidas principales de cada tema, con un nivel de detalle parecido al de los demás partidos, y juntamos algunas que van de lo mismo. En autogobierno: traspasar a la Generalitat el aeropuerto del Prat, los puertos y las carreteras del Estado, la Seguridad Social y el paro, las becas, las competencias agrarias y el personal de justicia; condonar la deuda del FLA y publicar las balanzas fiscales; el catalán como lengua obligatoria en las grandes plataformas digitales y válida en la justicia en toda España. En justicia y seguridad: derogar la «ley mordaza» y la prisión permanente revisable, suprimir la Audiencia Nacional y los aforamientos, y llegar a 26.800 mossos en 2032. En fiscalidad: deflactar el IRPF, eximir del IRPF el primer año de trabajo de los menores de 35 años, bajar Sociedades a las pymes y el IVA de la luz, el gas y las peluquerías. En vivienda: avales para la entrada de la primera vivienda a menores de 35 años, que la Administración pague al propietario el alquiler que no pueda pagar un inquilino vulnerable, derogar la contención de precios de la ley de vivienda y prohibir hasta 2028 que los fondos compren viviendas. También cuidados, derechos LGTBI, mundo rural, empleo, pensiones, sanidad, inmigración y política exterior."
