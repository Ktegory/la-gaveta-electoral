fecha: "2026-11-15"
partido: "fa"
tipo: "propuestas"
descripcion: "Añadimos las medidas de sanidad que presentó el 14 de noviembre en Sevilla: ampliar la atención dental pública al 50 % de la población en cuatro años, extender a todas las edades las ayudas del Plan VEO para gafas y lentillas, incluir los audífonos en la sanidad pública y reconocer la atención integral a la menopausia. También sus cuatro medidas para autónomos y pymes publicadas el 15 de noviembre: declaración anual del IVA para quien facture menos de 85.000 €, tarifa plana mientras se ingrese menos del SMI, alquileres comerciales de al menos 5 años y una ventanilla única para pymes."
