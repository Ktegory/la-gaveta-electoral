descripcion: "El Frente Amplio publicó el 17 de noviembre una versión corregida de su programa. Actualizamos las citas que cambian: la declaración anual del IVA para quien facture menos de 85.000 € pasa a ser opcional y sustituye a las trimestrales, y la tarifa plana de 88 € se mantendría mientras se ingrese menos del SMI. En otras cinco propuestas solo cambia la página citada. Añadimos el programa como fuente de las ayudas unificadas para pymes."
