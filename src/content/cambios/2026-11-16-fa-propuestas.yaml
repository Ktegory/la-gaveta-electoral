fecha: "2026-11-16"
partido: "fa"
tipo: "propuestas"
descripcion: "Añadimos cuatro medidas de la ficha «Reconocimiento de las familias elegidas», de la nueva sección de programa de su web (15 de noviembre): reconocer en la Ley de Familias a las personas que cada uno designe como referentes de cuidados, ampliar a ellas los permisos retribuidos, reconocer legalmente a las personas no binarias y crear un Observatorio Estatal contra la LGTBIQA+fobia. Y tres medidas de la presentación del programa en Madrid (16 de noviembre): limitar las herencias a 10 millones de euros por heredero, un fondo soberano con participación pública en las nuevas renovables y una prestación por crianza de 200 € al mes por menor. Con el programa publicado ese mediodía, añadimos 54 propuestas más. En vivienda: tope del alquiler en el 25 % de la renta del barrio, alquiler indefinido, fin de los pisos turísticos en edificios residenciales de zonas tensionadas, prohibir los desahucios sin alternativa y suprimir el régimen de las SOCIMI. En fiscalidad: IRPF más bajo hasta 27.000 € y del 52 % desde 300.000 €, y un tipo mínimo del 20 % en Sociedades. En empleo y pensiones: jornada de 32 horas, salario mínimo del 60 % del salario medio neto y jubilación a los 60 en oficios penosos. También sanidad, educación, cuidados, energía (tres horas de luz gratis al día), transporte, clima, financiación autonómica, migraciones, seguridad, justicia y política exterior."
