fecha: "2026-11-16"
partido: "bildu"
tipo: "propuestas"
descripcion: "Añadimos once medidas de las dos notas que publicó el 16 de noviembre, una que resume su programa y otra sobre pensiones: igualar las pensiones mínimas al SMI, subir al menos un 15 % las de viudedad y no contributivas, pensión sin penalización con 40 años cotizados, subida conforme al IPC, jornada de 32 horas, descarbonización en 2045, nuevas competencias, uso del euskera ante el Estado, rechazo a la OTAN y al aumento del gasto militar, recuperar el impuesto a las energéticas y quitar privilegios fiscales a las sociedades de inversión inmobiliaria. Con el programa publicado ese mismo día, añadimos 24 más. En vivienda: subida del alquiler limitada al 2 % e IVA del 21 % a los pisos turísticos. En precios y fiscalidad: tope al gas, control de márgenes e impuesto a las grandes distribuidoras de alimentación. También sanidad, cuidados, nuclear, transporte, aborto, LGTBI, migraciones, «ley mordaza», autogobierno, Cupo y Aportación, euskera e Israel."
