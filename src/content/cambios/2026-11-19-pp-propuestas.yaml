descripcion: "Alma Ezcurra planteó el 19 de noviembre en Lanzarote que la jurisdicción española pueda juzgar los delitos cometidos en alta mar durante las travesías migratorias. Añadimos también la medida 36 del programa del PP, que defendió en el mismo acto: reforzar la frontera sur con más agentes, presencia estable de Frontex y apoyo de las Fuerzas Armadas."
