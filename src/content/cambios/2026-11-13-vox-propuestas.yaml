fecha: "2026-11-13"
partido: "vox"
tipo: "propuestas"
descripcion: "Completamos las medidas de su avance con 18 propuestas y, tras publicar su programa completo, añadimos 43 más. Del avance, en inmigración: Ceuta, preferencia de los españoles en servicios y ayudas, remesas, ayudas y sanidad de los inmigrantes en situación irregular, alquiler, regularizaciones, nacionalidad, expulsiones y deportaciones, menores no acompañados, ONG y cooperación; además, deducciones por hijos, suelo, subvenciones, Mercosur y agua. Del programa: seguridad (edad penal, prisión permanente revisable, sedición, terrorismo, policías y narcotráfico), justicia y CGPJ, educación (LOMLOE, EVAU única, lenguas), familia y vida, sanidad, energía, autónomos, bajadas del IRPF, el IVA y Sociedades (sin cifras), fiscalidad en Canarias y en zonas despobladas, vivienda y defensa."
