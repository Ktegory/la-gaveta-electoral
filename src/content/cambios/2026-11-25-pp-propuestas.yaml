descripcion: "Añadimos dos medidas del programa del PP que Feijóo destacó el 24 de noviembre en Alicante: ampliar la prisión permanente revisable a los depredadores sexuales reincidentes y a quien oculte el cadáver de su víctima, y que la expulsión sea la regla para los extranjeros condenados por delitos sexuales, de sangre o multirreincidencia. Y una propuesta que Alberto Nadal anunció ese día en Zaragoza: derogar el decreto eléctrico de los centros de datos, con un plan de choque de inversión en la red que sí está en el programa. Y una medida del programa que el PP destacó en el 25N: pasar al Ministerio del Interior el sistema de pulseras antimaltrato, con la auditoría de sus fallos que Feijóo prometió ese día."
