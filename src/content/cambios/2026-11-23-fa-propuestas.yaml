descripcion: "Añadimos, en el nuevo apartado «Despoblación y medio rural», una medida del programa del Frente Amplio que el partido destacó el 22 de noviembre en un comunicado en Granada: garantizar por ley que los servicios públicos básicos estén a menos de 30 minutos de quien vive en el medio rural. Añadimos también dos medidas del programa que el Frente Amplio destacó el 23 de noviembre: anular las cláusulas de los contratos de alquiler que prohíban tener animales de compañía (Instagram) y gravar al 30 % el aumento del beneficio de las empresas que facturen más de 50 millones si no suben los salarios (acto en Arrasate)."
