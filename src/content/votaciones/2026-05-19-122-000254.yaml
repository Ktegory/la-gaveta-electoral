titulo: "Ley del PP contra la ocupación ilegal de viviendas"
resumen: "Requerimiento judicial para dejar la vivienda en 24 horas y, si no, desalojo inmediato. Además: más pena por usurpación, padrón nulo para el ocupante, cambios en la Ley de Propiedad Horizontal y devolución del IBI al propietario."
