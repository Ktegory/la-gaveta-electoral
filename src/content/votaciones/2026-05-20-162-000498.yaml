tituloOficial: |-
  Proposición no de Ley del Grupo Parlamentario Plurinacional SUMAR, para frenar la especulación inmobiliaria y garantizar el acceso a una vivienda digna.
  Se vota en los términos de la enmienda transaccional presentada por el Grupo Parlamentario Socialista y el Grupo Parlamentario Plurinacional SUMAR.
titulo: "Proposición pactada por PSOE y Sumar para limitar la compra especulativa de vivienda"
resumen: "Pedía al Gobierno limitar la compra de inmuebles según el territorio y el comprador «para terminar con la compra especulativa». Se votó el texto pactado por PSOE y Sumar, más suave que el original de Sumar, que pedía prohibir la compra a empresas y fondos."
incluiaAdemas: "Una reforma fiscal general: mejor trato a las rentas del trabajo y fin de los beneficios fiscales de las rentas del capital y de las SOCIMI."
