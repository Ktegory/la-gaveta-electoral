tituloOficial: Real Decreto-ley 26/2026, de 29 de septiembre, por el que se adoptan medidas urgentes para la protección de la función social de la vivienda y la ampliación de la oferta de vivienda asequible.
titulo: "Decreto de vivienda que suspendía los desahucios de hogares vulnerables hasta 2030"
resumen: "Suspendía hasta el 31 de diciembre de 2030 los desahucios de personas vulnerables sin alternativa de vivienda, con compensación al propietario en algunos casos."
incluiaAdemas: "Límites a la compra especulativa de vivienda, cambios en la Ley de Arrendamientos Urbanos y en la Ley de Vivienda, medidas fiscales y una cuenta de ahorro e inversión en la Ley del Mercado de Valores, sin relación con la vivienda."
