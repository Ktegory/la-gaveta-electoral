propuestas:
  - propuesta: psoe/desahucios-2030
    coincide: si
    pasaje: "Art. 2.1: «hasta el 31 de diciembre de 2030… el tribunal suspenderá por auto el proceso» cuando el demandado es vulnerable y no tiene alternativa. El art. 2.2 añade otra suspensión hasta 2030, con compensación al propietario."
  - propuesta: pp/deducciones-alquiler
    coincide: parcial
    pasaje: "Nuevo art. 68.6 de la Ley del IRPF (p. 49 del PDF): deducción del 10 % del alquiler de la vivienda habitual para inquilinos con base imponible inferior a 33.007,20 €, menor cuanto más se gana. No incluye la deducción al propietario que da título a la propuesta."
    parte: "El texto votado incluía la deducción en el IRPF para inquilinos, pero no la deducción al propietario que renueva el contrato."
