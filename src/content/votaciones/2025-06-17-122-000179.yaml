titulo: "Ley del PP para que las centrales nucleares sigan funcionando y no se cierren por calendario"
resumen: "Las centrales funcionarían hasta que su dueño pidiera el cierre o el Consejo de Seguridad Nuclear lo desaconsejara. Anulaba las fechas de cierre definitivo de Almaraz, Ascó I y Cofrentes y pedía que la planificación energética no contemplara cerrar ninguna central."
