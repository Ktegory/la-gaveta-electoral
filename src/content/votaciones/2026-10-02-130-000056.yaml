tituloOficial: Real Decreto-ley 27/2026, de 29 de septiembre, por el que se adoptan medidas urgentes para reforzar la estabilidad de los contratos de arrendamiento de vivienda habitual.
titulo: "Decreto para que los contratos de alquiler se prorroguen por periodos de cinco años sin fecha de fin"
resumen: "Si el casero no avisaba, el contrato de vivienda habitual se prorrogaría obligatoriamente por periodos sucesivos de cinco años (siete si el casero es una empresa). No renovar sin una de las causas previstas costaría al menos doce mensualidades. Añadía prórrogas extraordinarias para inquilinos vulnerables y en zonas tensionadas."
