notas: "Reel de @i_montero_, la cuenta que la web de campaña pazcasaytrabajo.es enlaza como su Instagram. Recoge su intervención en el acto central de ERC en Barcelona (Campus Ciutadella de la UPF) del 22 nov. Europa Press lo publicó en vídeo el mismo día: «ha pedido que se derogue la conocida como 'Ley Beckam' y los privilegios fiscales para los extranjeros que trabajan en España» (https://www.europapress.es/videos/video-montero-pide-derogar-ley-beckham-privilegios-fiscales-expats-you-have-to-pay-20261122172535.html). Citamos el texto de la publicación, no lo que se dice en el vídeo. Sin copia archivada: web.archive.org no suele conservar Instagram."
