notas: "Publicado en podemos.info el 18 nov (1.830.035 bytes, last-modified 18 nov 09:18 GMT). La web de campaña pazcasaytrabajo.es/programa enlaza una copia idéntica (misma sha256) en /programa-electoral/programa-electoral-paz-casa-y-trabajo.pdf. Una introducción y 6 capítulos: vivienda; precios; paz; trabajo; vida y planeta (con tres apartados: vidas dignas, servicios públicos y planeta), y España como república plurinacional. Las medidas van numeradas dentro de cada capítulo. La página impresa coincide con la del PDF. Sin copia en web.archive.org: no se ha podido crear desde aquí."
