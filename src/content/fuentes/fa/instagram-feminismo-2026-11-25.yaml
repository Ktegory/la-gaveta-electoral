notas: "Publicación de la cuenta oficial @elfrenteamplio en el 25N. Enumera propuestas feministas: el aborto como derecho fundamental en la Constitución; un 10 % más de recursos contra las violencias machistas; un Pacto de Estado por los Cuidados, permisos de nacimiento de hasta 20 semanas e inversión en dependencia del 0,8 % al 1,7 % del PIB en 2030, y preservativos gratis en farmacias para jóvenes, copas menstruales gratuitas, atención a la menopausia y una ley contra la violencia obstétrica. Citamos el texto de la publicación. Sin copia archivada: web.archive.org no suele conservar Instagram."
