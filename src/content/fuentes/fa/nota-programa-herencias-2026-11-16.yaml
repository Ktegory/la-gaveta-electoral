notas: "Nota de prensa del Frente Amplio (16 nov, 12:07; modificada a las 12:15) sobre la presentación del programa en Madrid por Pablo Bustinduy. Además del límite a las herencias, recoge en lista las medidas destacadas por los responsables de área. La cuenta oficial @elfrenteamplio publicó el límite a las herencias en Instagram el mismo día. El programa completo en PDF está enlazado desde frenteamplio.info/programa/todas/ (no descargado en esta ronda). Sin copia archivada: no se puede crear desde aquí."
