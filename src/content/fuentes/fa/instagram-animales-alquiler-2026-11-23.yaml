notas: "Publicación de la cuenta oficial @elfrenteamplio. Enumera seis medidas sobre animales: anular las cláusulas de los contratos de alquiler que prohíban animales de compañía, bajar al 10 % el IVA veterinario, reconocer la veterinaria como profesión sanitaria esencial, proteger a los perros de caza y de trabajo con la misma ley que al resto, eliminar las subvenciones estatales a la tauromaquia e impulsar un Plan Abandono Cero. Citamos el texto de la publicación. Sin copia archivada: web.archive.org no suele conservar Instagram."
