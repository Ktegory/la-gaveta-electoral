notas: "Publicación de la cuenta oficial @elfrenteamplio. Enumera cuatro propuestas sobre la crisis climática: un fondo generacional de la energía, un abono único y mensual para todo el transporte público, una misión nacional de agricultura regenerativa para las explotaciones pequeñas y medianas, y apagar los incendios en invierno gestionando el monte todo el año con empleo público. Citamos el texto de la publicación. Sin copia archivada: web.archive.org no suele conservar Instagram."
