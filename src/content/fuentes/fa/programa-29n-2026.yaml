notas: "Presentado en Madrid el 16 de noviembre y enlazado desde frenteamplio.info/programa/todas/. 18 capítulos. El PDF tenía 151 páginas (158 desde el 23 nov), pero las portadas de capítulo son dobles: citamos el número de página impreso en la cabecera, que va por delante del del archivo (la página 16 impresa es la 13 del PDF). El archivo lo descargó a mano la persona responsable el 16 nov y coincide con el publicado (1.139.608 bytes, last-modified 16 nov 11:16 GMT). El 17 nov el FA publicó una versión corregida con el mismo número de páginas (1.138.847 bytes, last-modified 17 nov 18:30:42 GMT, descargada con permiso): cambia la medida de cultura (del 0,2 % del PIB al 2 % del gasto público), añade un punto sobre cláusulas salariales ligadas al IPC, reescribe varias medidas para autónomos y mueve algunas páginas del capítulo 4. Hasta el 23 nov, las citas estaban cotejadas con esta versión. El 18 nov el servidor muestra una fecha nueva (last-modified 18 nov 16:31:56 GMT, etag \"6afdd2fc-11609f\"), pero el archivo es idéntico: misma sha256. El 23 nov el FA publicó otra versión (1.169.650 bytes, 158 páginas, sha256 d7e2c815…, last-modified 23 nov 18:33:23 GMT y, al descargarla, 20:04:51 GMT con el mismo tamaño): añade el apartado 2.9, «El deporte como derecho» (páginas 47 a 53), quita una frase del punto «Solo sí es sí» (que la violencia y la intimidación sean agravantes y no requisitos del tipo básico) y acorta otra sobre los derechos de las personas que ejercen la prostitución. A partir de la página 47 las páginas impresas se desplazan 8. Las citas están cotejadas con esta versión: todas siguen igual. Sin copia en web.archive.org: no se ha podido crear desde aquí."
