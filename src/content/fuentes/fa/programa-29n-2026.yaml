notas: "Presentado en Madrid el 16 de noviembre y enlazado desde frenteamplio.info/programa/todas/. 18 capítulos. El PDF tiene 151 páginas, pero las portadas de capítulo son dobles: citamos el número de página impreso en la cabecera, que va por delante del del archivo (la página 16 impresa es la 13 del PDF). El archivo lo descargó a mano la persona responsable el 16 nov y coincide con el publicado (1.139.608 bytes, last-modified 16 nov 11:16 GMT). El 17 nov el FA publicó una versión corregida con el mismo número de páginas (1.138.847 bytes, last-modified 17 nov 18:30:42 GMT, descargada con permiso): cambia la medida de cultura (del 0,2 % del PIB al 2 % del gasto público), añade un punto sobre cláusulas salariales ligadas al IPC, reescribe varias medidas para autónomos y mueve algunas páginas del capítulo 4. Las citas están cotejadas con esta versión. El 18 nov el servidor muestra una fecha nueva (last-modified 18 nov 16:31:56 GMT, etag \"6afdd2fc-11609f\"), pero el archivo es idéntico: misma sha256. Sin copia en web.archive.org: no se ha podido crear desde aquí."
