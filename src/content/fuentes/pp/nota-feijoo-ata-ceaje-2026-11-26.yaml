notas: "Nota de prensa del PP (26 nov, 17:34). Alberto Núñez Feijóo se reúne en la sede nacional del partido con Lorenzo Amor (ATA) y Antonio Magraner (CEAJE) y repasa sus medidas para autónomos. Sin copia archivada: no se ha podido crear desde la ronda automática."
