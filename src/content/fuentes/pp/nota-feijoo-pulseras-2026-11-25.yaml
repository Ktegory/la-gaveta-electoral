notas: "Nota de prensa del PP (25 nov, 9:35). Alberto Núñez Feijóo se reúne en la sede nacional del PP con una víctima de los fallos de las pulseras antimaltrato, en el 25N. Feijóo lo publicó también en Instagram (@anunezfeijoo, en colaboración con @partidopopular): «llevar a cabo una auditoría completa sobre el escándalo de las pulseras». Europa Press lo recoge el mismo día (9:41). Sin copia archivada: no se ha podido crear desde la ronda automática."
