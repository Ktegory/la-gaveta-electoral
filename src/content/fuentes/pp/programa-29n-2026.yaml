notas: "Presentado en Madrid el 10 de noviembre. 249 medidas numeradas; las 109, 164, 173, 200 y 210 están en blanco («Permanezca atento a la campaña para conocer esta nueva medida»). El 11 de noviembre el enlace al archivo «-1» dejó de funcionar; este enlace sirve el mismo archivo (misma huella sha256, 82 págs.). Ese día el PP subió además una maquetación nueva de 64 páginas (PROGRAMA-ELECTORAL-PP-2026-RECONSTRUCCION-NACIONAL.pdf) con el mismo texto y las mismas medidas en blanco; citamos las páginas de la versión de 82."
