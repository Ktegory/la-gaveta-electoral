notas: "Nota de prensa del PP (16 nov, 14:38) sobre la visita de Alberto Núñez Feijóo a una explotación agrícola y ganadera en Vallfogona de Balaguer (Lleida). Presenta las medidas como parte del «Libro Blanco para el futuro rural de España». Casi todo el texto está en estilo indirecto. Un párrafo aparece cortado en la web («ya que la Agencia»). Feijóo publicó en Instagram (@anunezfeijoo) el compromiso del pacto el mismo día. Sin copia archivada: no se puede crear desde la ronda automática."
