notas: "Entrada de las 11:29 del directo de campaña de Público del 16 nov (firma «Sara Pardo García / Agencias»), sobre el desayuno informativo de Amics del País en Barcelona con Miriam Nogueras y Artur Mas. La nota oficial de Junts del mismo acto («La garantia per a les empreses…», junts.cat) habla de «una fiscalitat favorable» y de las competencias en inmigración, pero no menciona Sucesiones ni expulsiones. Es una página en directo que se actualiza: sin copia archivada (no se puede crear desde la ronda automática)."
