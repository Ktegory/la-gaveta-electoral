notas: "Publicada en junts.cat el 17 nov a las 11:25 (hora peninsular). Miriam Nogueras propone a los cabezas de lista de todas las formaciones en Cataluña firmar el compromiso «El català, cosa de tots», con cuatro puntos. Es un compromiso de los candidatos, no una medida de gobierno. Sin copia archivada: no se puede crear desde aquí."
