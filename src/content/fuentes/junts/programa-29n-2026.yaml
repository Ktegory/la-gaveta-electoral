notas: "En catalán. Publicado el 18 nov en tualcentre.cat, la web de campaña de Junts: su aviso legal dice que el titular es Junts per Catalunya, y el menú enlaza el PDF como «Programa electoral» (1.355.756 bytes, last-modified 18 nov 17:06 GMT). No está en junts.cat. ABC difundió una copia idéntica (misma sha256) el 23 nov. Una introducción y tres bloques, con 26 apartados: derechos y libertades; bienestar, y estructuras y modelo productivo. Termina con un anexo de iniciativas de la legislatura. Cada apartado acaba en «Punts de programa», con medidas numeradas por objetivo (1.1, 1.2…). La página impresa coincide con la del PDF. Sin copia en web.archive.org: no se ha podido crear desde aquí."
