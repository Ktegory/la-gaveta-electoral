notas: "En catalán. Presentado el 5 de noviembre (NacióDigital, El Nacional e Infobae, 5 nov). Medidas numeradas hasta la 258, pero la numeración salta de la 167 a la 198 y de la 250 a la 252. El archivo enlazado tiene fecha interna de creación del 10 de noviembre. esquerrarepublicana.cat redirige a esquerra.cat, la web del partido. El 17 nov ERC publicó una versión corregida (300.005 bytes, last-modified 17 nov 16:33:55 GMT, descargada con permiso): renumera las medidas de forma correlativa desde la 168 (ahora acaban en la 227) y mantiene las páginas. Las citas están cotejadas con esta versión."
