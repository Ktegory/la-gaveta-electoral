  nota: "Cita tomada el 14 nov de la nota oficial de EAJ-PNV (busca «Baiona-Donostia»). Subtema nuevo «Transporte», dentro de Fiscalidad y economía. La nota también habla de los pasos a nivel de Zalla y del Irun-Brinkola, pero como críticas, sin una medida concreta: no los incluyo."
