titulo: "Hacer el tren Baiona-Donostia, conectar Pasaia y Navarra por tren y ejecutar el tramo Astigarraga-Oiartzun-Lezo"
resumen: "Cuatro conexiones ferroviarias pendientes en Euskadi: el tren Baiona-Donostia, la conexión con el puerto de Pasaia, la de la Y vasca con Navarra y el tramo Astigarraga-Oiartzun-Lezo del Corredor Atlántico, para que las mercancías no pasen por Donostialdea. Lo presentó la candidata por Gipuzkoa, Maribel Vaquero, en Tolosa."
