titulo: "Facilitar a los autónomos el acceso a la prestación por desempleo y equipararla a la de los asalariados"
resumen: "La protección por cese de actividad se iría acercando a la prestación por desempleo, con requisitos más simples y acceso más fácil cuando el cierre sea involuntario. El programa añade que esa prestación se pueda compatibilizar durante un tiempo con un nuevo proyecto empresarial."
