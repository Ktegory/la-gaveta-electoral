titulo: "Modificar la Ley del Suelo para que un defecto subsanable no anule un plan urbanístico"
resumen: "Lo plantea para construir más vivienda, porque considera que la oferta no cubre la demanda actual: que un error corregible no obligue a empezar de cero la tramitación de un plan urbanístico."
