titulo: "Dar una prestación vitalicia a las personas LGTBI que sufrieron represión en el franquismo y la Transición"
resumen: "La recogería una ley de memoria y reparación para las personas trans y LGTBI. Equivaldría a la pensión mínima de jubilación para mayores de 65 años sin cargas familiares, sería compatible con otros ingresos y subiría un 50 % para quienes sufrieron privación de libertad."
