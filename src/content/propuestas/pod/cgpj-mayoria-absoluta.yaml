titulo: "Exigir mayoría absoluta y el apoyo de la mitad de los grupos para elegir a los vocales judiciales del CGPJ"
resumen: "El Congreso seguiría eligiendo a los doce vocales del turno judicial. Añade mecanismos de cese y sustitución de los miembros del CGPJ y del Tribunal Constitucional con el mandato agotado, y avales ciudadanos y comparecencias públicas para las candidaturas."
