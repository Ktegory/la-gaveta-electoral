titulo: "Prohibir los pisos turísticos mientras dure la emergencia habitacional y retirar poco a poco las licencias existentes"
resumen: "No habría licencias nuevas y los pisos turísticos ilegales se cederían gratis y de forma obligatoria a la Empresa Inmobiliaria Pública. En zonas de turismo masificado habría una moratoria indefinida de nuevas plazas hoteleras, con excepciones para el turismo rural, y un nuevo Cuerpo Público de Inspectores de Vivienda vigilaría el cumplimiento."
