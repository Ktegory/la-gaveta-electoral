titulo: "Crear un impuesto permanente sobre los beneficios extraordinarios de la gran banca que recaude al menos el 50 %"
resumen: "Su documento político de 2025 lo planteaba para las empresas del IBEX; el programa lo concreta en la gran banca. A eléctricas y petroleras les reclamaría íntegros los beneficios que superen los anteriores a las crisis energéticas, y a la banca, la devolución del rescate."
