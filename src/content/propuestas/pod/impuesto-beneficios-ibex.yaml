  nota: "18 nov: añadimos el programa del 29N como fuente principal (página 17). El programa habla de la «gran banca», no de las empresas del IBEX: cambian título y resumen. Quitada la firma para revisar de nuevo. Nota anterior: La frase empieza en la p. 36 («hay que implementar, en particular, un impuesto…»). Es un documento de abril de 2025, no un programa electoral de 2026. La comprobación sitúa el pasaje en la p. 37 del PDF (el archivo dice 30–39)."
