titulo: "Reconocer derechos de cuidados a las familias elegidas y a las relaciones no monógamas"
resumen: "Crearía un marco legal de redes de cuidados que incluye a las amistades, las familias elegidas y las relaciones no monógamas: sus integrantes podrían ser referentes para permisos retribuidos por enfermedad, hospitalización, fallecimiento y cuidados, y para acompañar y criar a menores. Irene Montero lo llama «el derecho a la familia elegida»."
