titulo: "Pagar a quienes cuidan a familiares dependientes una prestación de hasta el 100 % del SMI según el grado"
resumen: "Modificaría el artículo 18 de la Ley de Dependencia: 100 % del SMI para el grado III, 70 % para el grado II y 40 % para el grado I, actualizada con el SMI vigente."
