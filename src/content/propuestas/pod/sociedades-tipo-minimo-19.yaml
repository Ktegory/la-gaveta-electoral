titulo: "Subir del 15 % al 19 % el tipo mínimo de Sociedades y fijar a los oligopolios un 29 % mínimo y un 35 % nominal"
resumen: "El tipo mínimo se calcularía sobre los beneficios reales y no sobre la base imponible. También reduciría del 95 % al 80 % la exención de dividendos y plusvalías de filiales, limitaría a tres años la compensación de bases negativas y al 20 % de la cuota los créditos fiscales."
