titulo: "Dedicar a medidas sociales el aumento del gasto militar desde 2023"
resumen: "Irene Montero cifra ese aumento en 24.000 millones de euros, según sus cálculos, y propone usarlo para nacionalizar Repsol, contratar personal sanitario y docente, expropiar el uso de viviendas de fondos y crear un supermercado público, entre otras medidas. Lo planteó en un desayuno informativo de Europa Press."
