titulo: "Establecer una moratoria a los regadíos hiperintensivos en manos de fondos y grandes propietarios"
resumen: "La moratoria se extendería a los nuevos regadíos ordinarios en cuencas con sequía habitual. También prohibiría vender derechos de riego a explotaciones de fondos o grandes corporaciones y, en sequía, cortaría el agua para usos como campos de golf o piscinas privadas."
