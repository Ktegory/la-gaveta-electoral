titulo: "Rechazar el objetivo de la OTAN de elevar el gasto militar al 5 % del PIB en 2035"
resumen: "Rechaza el compromiso del Gobierno de llegar al 5 % del PIB en gasto militar en 2035 y propone priorizar la inversión en derechos sociales. En otra medida plantea revertir el aumento del gasto militar y congelarlo durante la legislatura, salvo para mejorar salarios, condiciones y alojamiento de la tropa."
