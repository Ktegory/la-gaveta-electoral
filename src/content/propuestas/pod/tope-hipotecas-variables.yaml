titulo: "Limitar el interés de las hipotecas variables de las rentas bajas al euríbor más un 0,1 % mientras supere el 2 %"
resumen: "Para la vivienda habitual de hogares con ingresos por debajo de tres veces el IPREM, umbral que sube un 0,3 por cada hijo o hija. Duraría dos años prorrogables, el coste lo asumirían los bancos y estos tendrían que facilitar el paso a tipo fijo sin barreras ni costes."
