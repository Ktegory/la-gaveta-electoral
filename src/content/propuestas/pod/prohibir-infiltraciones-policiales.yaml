resumen: "El programa lo incluye en una medida para «acabar con las cloacas del Estado»: prohibir la infiltración policial en movimientos sociales pacíficos, crear un delito de utilización de las estructuras de seguridad del Estado para delinquir, con penas agravadas, y sancionar a los agentes implicados, incluso con la expulsión del cuerpo. Irene Montero lo planteó el 21 de noviembre junto a la derogación de la ley mordaza."
