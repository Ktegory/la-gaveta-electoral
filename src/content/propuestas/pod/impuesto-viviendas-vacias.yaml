titulo: "Cuadruplicar el tipo de IRPF de las viviendas vacías y crear un impuesto estatal sobre ellas"
resumen: "Se cuadruplicaría el tipo de IRPF de las rentas imputadas de las viviendas que no son la del contribuyente. El impuesto estatal sería igual al recargo del IBI que pueden cobrar los ayuntamientos, y deducible donde ya se cobre. No dice desde cuántas viviendas se aplicaría."
