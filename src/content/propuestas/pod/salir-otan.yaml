titulo: "Salir de la OTAN y cerrar las bases estadounidenses de Rota y Morón"
resumen: "Mediante la denuncia del Tratado del Atlántico Norte. En otras medidas propone revertir el aumento del gasto militar y rechazar el objetivo del 5 % del PIB."
fuentes:
  - fuente: "pod/programa-29n-2026"
    pagina: "28"
    cita: "Impulsaremos la salida de España de la OTAN mediante la denuncia del Tratado del Atlántico Norte y pondremos fin a la presencia militar estadounidense en nuestro territorio, incluida la Base Naval de Rota y la Base Aérea de Morón."
  - fuente: "pod/documento-politico-2025"
    pagina: "33"
    cita: Hay que abandonar la OTAN a la mayor brevedad y hay que desacatar la orden de Donald Trump de aumentar el gasto militar en Europa.
  - fuente: "pod/web-campana"
    cita: Ser socio de EEUU en la OTAN nos pone en peligro. […] Estas son las guerras de los dueños del mundo y no de la gente. España tiene que ser un refugio. Ni un euro más a armas.
