comprobacion:
  estado: encontrada
  nota: "18 nov: añadimos el programa del 29N como fuente principal (página 28). El programa concreta la vía y añade las bases; lo del gasto militar va en sus propias fichas. Quitada la firma para revisar de nuevo. Nota anterior: La web de campaña critica la OTAN y dice «Ni un euro más a armas», pero no dice «salir». Lo de salir está en el Documento Político de la V Asamblea (abril de 2025), p. 33; se añadió como fuente el 11 nov."
