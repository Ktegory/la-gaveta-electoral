titulo: "Bajar los alquileres un 40 % por ley"
resumen: "Se aplicaría a los contratos vigentes, a sus renovaciones y prórrogas y a los nuevos, sin que el precio resultante quede por debajo del 60 % del precio medio de la zona. Si la vivienda nunca se ha alquilado, el precio inicial sería el 60 % del precio medio de la zona."
