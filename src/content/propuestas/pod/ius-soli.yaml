titulo: "Reconocer como españoles de origen a los nacidos en España si un progenitor llevaba un año en situación legal"
resumen: "Modificaría el artículo 17.1 c) del Código Civil. Bastaría con que cualquiera de los progenitores hubiera estado legalmente en España durante un año antes del nacimiento."
fuentes:
  - fuente: "pod/programa-29n-2026"
    pagina: "66"
    cita: "Asimismo, serán españoles de origen los nacidos en España de padres extranjeros cuando, con anterioridad al nacimiento, cualquiera de los progenitores hubiera permanecido legalmente de estancia en España durante un año."
