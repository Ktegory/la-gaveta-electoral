titulo: "Gravar entre un 7 % y un 15 % los beneficios de las grandes empresas más contaminantes"
resumen: "Con tipos progresivos según el volumen de beneficios y las emisiones de carbono. En el anuncio del 10 nov, Irene Montero hablaba de los beneficios de las actividades contaminantes. El programa añade recargos a los jets privados, las grandes embarcaciones y los vehículos de lujo."
