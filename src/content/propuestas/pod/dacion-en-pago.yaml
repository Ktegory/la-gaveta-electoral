titulo: "Reconocer la dación en pago y limitar la deuda hipotecaria al valor de la vivienda"
resumen: "La hipoteca y los suministros básicos no podrían superar juntos el 30 % de los ingresos del hogar, con quitas obligatorias de las cuotas si hace falta. Un Fondo de Responsabilidad Social pagado por los bancos, con el 0,15 % del crédito al año durante 30 años, compensaría los daños de la actividad financiera."
