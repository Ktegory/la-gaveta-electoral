titulo: "Derogar la «ley Beckham», el régimen especial del IRPF para quienes se trasladan a trabajar a España"
resumen: "Según el programa, ese régimen permite a quienes se trasladan a trabajar a España tributar durante seis años mucho menos que los contribuyentes ordinarios. Irene Montero lo destacó el 22 de noviembre en el acto central de ERC en Barcelona, dirigiéndose a los trabajadores extranjeros desplazados («expats»)."
