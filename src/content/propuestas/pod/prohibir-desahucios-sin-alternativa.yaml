titulo: "Prohibir los desahucios de personas vulnerables sin alternativa habitacional y suspenderlos de forma indefinida"
resumen: "Incluye los contratos de renta antigua y, si no hay alternativa habitacional digna, se presumirá la vulnerabilidad. Añade asistencia letrada en el desalojo y una alternativa cerca de donde viven («cláusula Maricarmen»); una plaza en una institución residencial no contará como alternativa."
