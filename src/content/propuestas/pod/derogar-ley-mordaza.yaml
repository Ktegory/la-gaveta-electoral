titulo: "Derogar la Ley de Seguridad Ciudadana («ley mordaza»), prohibir las pelotas de goma y limitar la detención a 48 horas"
resumen: "La sustituiría por una nueva regulación. Las declaraciones de los agentes perderían la presunción de veracidad y para sancionar tendrían que ir acompañadas de otros testigos o de pruebas materiales; el plazo máximo de detención sería de 48 horas en cualquier supuesto."
