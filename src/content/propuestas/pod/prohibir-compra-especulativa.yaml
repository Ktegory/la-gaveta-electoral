titulo: "Prohibir la compra especulativa de vivienda"
resumen: "La vivienda comprada tendría que ser la residencia habitual de quien la compra o de un familiar hasta segundo grado, o su segunda residencia, durante los cuatro años siguientes, sin quedar vacía ni alquilarse salvo excepciones como el alquiler social o la movilidad laboral. En las islas habría límites a quienes no residan en ellas."
