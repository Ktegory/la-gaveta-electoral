titulo: "Derogar la Ley 15/1997 y prohibir la externalización y privatización de centros y servicios sanitarios"
resumen: "También derogaría los artículos 66, 67 y 90 de la Ley General de Sanidad. Los servicios privatizados volverían a lo público al vencer los contratos, sin prórroga, y el personal de nuevo ingreso de MUFACE, ISFAS y MUGEJU iría a la sanidad pública."
