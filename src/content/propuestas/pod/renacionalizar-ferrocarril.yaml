titulo: "Volver a un único operador ferroviario público, reunir Renfe y Adif y revocar las licencias de Ouigo e Iryo"
resumen: "Lo plantea como una renacionalización usando el artículo 128 de la Constitución. El patrimonio y la estructura de Ouigo e Iryo se nacionalizarían e integrarían en el operador público, de modo que todos los trenes de pasajeros serían de Renfe."
