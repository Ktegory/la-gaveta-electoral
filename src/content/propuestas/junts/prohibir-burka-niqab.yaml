    pagina: "48"
    cita: "Prohibir a l’espai públic les peces que cobreixen totalment o substancialment el rostre i impedeixen identificar la persona, com el niqab i el burca, tal com proposa la llei del vel integral que Junts va presentar el febrer de 2026. La prohibició no afecta el hijab."
