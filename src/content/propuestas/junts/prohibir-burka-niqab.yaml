titulo: "Prohibir en el espacio público las prendas que tapan el rostro, como el niqab y el burka"
resumen: "Punto 4.2 del apartado de inmigración. Es la ley del velo integral que Junts presentó en febrero de 2026. Afecta a las prendas que cubren total o sustancialmente la cara e impiden identificar a la persona; el programa precisa que no afecta al hiyab."
