titulo: "Crear un salario mínimo catalán que avance hacia el 60 % del salario medio en Cataluña"
resumen: "Junts reclama la competencia para fijar un salario mínimo propio, adaptado al coste de la vida y acordado con los agentes sociales. Según el punto 5.1 del apartado de economía, avanzaría de forma progresiva hacia el 60 % del salario medio catalán, con medidas de acompañamiento para las pequeñas empresas. En el apartado de personas mayores el programa cifra ese salario mínimo catalán en 1.400 euros mensuales en 14 pagas."
