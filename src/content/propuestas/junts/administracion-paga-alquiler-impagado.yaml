    cita: "Garantir que el petit propietari cobri. Quan un llogater vulnerable no pugui pagar el lloguer, l’Administració ha d’abonar la totalitat del deute al propietari en un termini màxim de dos mesos, amb fons de l’Estat. Si el pagament no es fa en aquest termini, el procediment de desnonament continua."
