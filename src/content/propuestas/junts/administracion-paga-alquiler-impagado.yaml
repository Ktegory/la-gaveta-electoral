titulo: "Que la Administración pague en dos meses al propietario el alquiler que no pueda pagar un inquilino vulnerable"
resumen: "Punto 2.1 del apartado de vivienda. Pagaría la totalidad de la deuda con fondos del Estado; si no lo hace en ese plazo, el procedimiento de desahucio sigue adelante."
