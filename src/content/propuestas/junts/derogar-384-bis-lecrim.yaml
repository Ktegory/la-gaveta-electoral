titulo: "Derogar el artículo 384 bis de la Ley de Enjuiciamiento Criminal, que suspende a cargos públicos en prisión provisional"
resumen: "Punto 1.2 del programa. El artículo permite suspender a cargos públicos procesados por rebelión o terrorismo cuando están en prisión provisional; Junts sostiene que vulnera el derecho a la participación política de los cargos electos según resoluciones de Naciones Unidas."
fuentes:
