  nota: "Cotejada el 17 nov (ronda de las 8:04) en el directo de Público, entrada de las 11:29 del 16 nov (busca «Sucesiones y Donaciones»). Es paráfrasis de la agencia, no una frase entrecomillada de Nogueras. La nota oficial de Junts del acto no lo recoge: conviene buscar una fuente del partido antes de firmar. El 24 nov se añadió como fuente principal el programa de Junts (PDF de tualcentre.cat, sha256 cde2c5f3…): apartado «L’economia, les empreses i el treball al centre», punto 2.2, pág. 68, busca «Eliminar l’impost de successions». En la pág. 58 (punto 5.4) dice «Impulsar l’eliminació de l’impost de successions»."
