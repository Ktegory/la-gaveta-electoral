titulo: "Eliminar el impuesto de Sucesiones y Donaciones"
resumen: "Lo defendió Miriam Nogueras en un desayuno de Amics del País en Barcelona, junto a bajar el IRPF. La crónica no dice si se refiere al impuesto estatal o al que gestiona la Generalitat, ni da plazos."
fuentes:
  - fuente: "junts/prensa-amics-del-pais-2026-11-16"
    cita: "La candidata de Junts al Congreso, Miriam Nogueras, ha abogado este lunes por \"agilizar los expedientes de expulsión\" a migrantes en situación irregular, al tiempo que ha defendido bajar el IRPF y eliminar el impuesto de Sucesiones y Donaciones."
