titulo: "Eliminar el impuesto de Sucesiones y Donaciones"
resumen: "Está en el programa (punto 2.2 de economía) y Miriam Nogueras lo defendió el 16 de noviembre en un desayuno de Amics del País en Barcelona, junto a bajar el IRPF. El programa no dice si se refiere al impuesto estatal o al que gestiona la Generalitat, ni da plazos."
