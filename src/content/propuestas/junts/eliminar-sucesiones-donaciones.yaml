destacada: false
comprobacion:
  estado: encontrada
  nota: "Cotejada el 17 nov (ronda de las 8:04) en el directo de Público, entrada de las 11:29 del 16 nov (busca «Sucesiones y Donaciones»). Es paráfrasis de la agencia, no una frase entrecomillada de Nogueras. La nota oficial de Junts del acto no lo recoge: conviene buscar una fuente del partido antes de firmar."
