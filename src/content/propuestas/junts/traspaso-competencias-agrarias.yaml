titulo: "Traspasar a la Generalitat las competencias agrarias que retiene el Estado y regionalizar la PAC"
resumen: "Punto 1.1 del apartado del sector primario: traspaso inmediato e íntegro de las competencias agrarias, ganaderas, forestales y pesqueras, con sus recursos. Los puntos 1.3 de ese apartado y 2.1 del de mundo rural piden que Cataluña participe en el diseño y la aplicación de la PAC y recupere los fondos «detraídos»."
fuentes:
  - fuente: "junts/programa-29n-2026"
    pagina: "74"
    cita: "Exigir el traspàs immediat i íntegre a la Generalitat de totes les competències en matèria agrària, ramadera, forestal i de pesca que l’Estat espanyol encara reté, amb els recursos econòmics i humans corresponents"
  - fuente: "junts/programa-29n-2026"
    pagina: "74"
    cita: "Exigir que Catalunya participi directament en el disseny i l’aplicació de la PAC i d’altres fons europeus del sector, amb marge per adaptar-ne els ajuts a les especificitats de l’agricultura i la ramaderia catalanes."
  - fuente: "junts/programa-29n-2026"
    pagina: "86"
    cita: "Exigir la regionalització efectiva de la PAC i la recuperació dels fons detrets, defensant la definició catalana de «pagès genuí» i la flexibilització de requisits ambientals davant situacions de sequera o crisis."
