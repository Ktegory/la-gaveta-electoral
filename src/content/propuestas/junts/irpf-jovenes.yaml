titulo: "Eximir del IRPF estatal a los menores de 35 años su primer año de trabajo y reducirlo hasta el décimo"
resumen: "Punto 4.2 del apartado de jóvenes, con un límite de renta: exención total el primer año de actividad laboral, reducción del 75 % el segundo y del 50 % el tercero, y reducción progresiva hasta el décimo. Añade una deducción del 15 % de los gastos en formación superior reglada, idiomas o certificaciones tecnológicas para jóvenes trabajadores."
