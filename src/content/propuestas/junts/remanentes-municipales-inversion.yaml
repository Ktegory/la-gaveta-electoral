    cita: "Reformar la LOEPSF perquè els ajuntaments puguin destinar sempre els romanents i superàvits a inversions, habitatge i serveis per a la ciutadania, i no només a amortitzar deute. […] Volem que deixi de dependre d’un decret i sigui un dret permanent dels ajuntaments."
