titulo: "Que los ayuntamientos puedan gastar siempre sus remanentes en inversión, vivienda y servicios sin depender de decretos"
resumen: "Punto 1.1 del programa. Propone reformar la ley de estabilidad presupuestaria (LOEPSF): hoy solo pueden hacerlo cuando el Gobierno lo autoriza por decreto (Junts cita los reales decretos ley 15/2025 y 13/2026), y quiere que sea un derecho permanente de los ayuntamientos."
