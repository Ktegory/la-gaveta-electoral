partido: "junts"
tema: "fiscalidad"
subtema: "irpf"
titulo: "Deflactar cada año el IRPF según la inflación y bajar los primeros tramos"
resumen: "Punto 5.2 del apartado de personas mayores y punto 2.1 del de economía. Propone actualizar cada año la tarifa y los mínimos personales y familiares según la inflación, con un mecanismo automático fijado por ley que tenga en cuenta también el IPC catalán, además de rebajar los primeros tramos y subir esos mínimos."
fuentes:
  - fuente: "junts/programa-29n-2026"
    pagina: "57"
    cita: "Deflactar anualment les tarifes i els mínims personals i familiars de l’IRPF d’acord amb la inflació, evitant increments fiscals derivats exclusivament de la pèrdua de valor dels diners. Establir per llei un mecanisme automàtic de revisió de la fiscalitat en funció de la inflació, de l’IPC català i el superior cost de la vida a Catalunya"
  - fuente: "junts/programa-29n-2026"
    pagina: "68"
    cita: "Deflactar l’IRPF, rebaixar els primers trams, augmentar els mínims personals i familiars i actualitzar-los anualment segons la inflació."
