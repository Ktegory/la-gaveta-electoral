titulo: "Eliminar con carácter retroactivo la penalización por jubilación anticipada a quien haya cotizado 40 años o más"
resumen: "Punto 5.3 del apartado de personas mayores y punto 5.4 del de economía. Quienes se jubilen con 40 años o más cotizados cobrarían la pensión íntegra, fijado por ley."
