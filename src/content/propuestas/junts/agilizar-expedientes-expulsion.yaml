titulo: "Agilizar los expedientes de expulsión de migrantes en situación irregular"
resumen: "Lo planteó Miriam Nogueras en un desayuno de Amics del País en Barcelona, junto a su prioridad de que Catalunya asuma las competencias en inmigración. La crónica no detalla cómo ni con qué plazos."
