    pagina: "49"
    cita: "Garantir que les resolucions de retorn es compleixin quan legalment correspongui, sense expedients eterns. Cal distingir sempre la situació d’un adult sense dret a quedar-se de la d’un sol·licitant d’asil, una víctima de tracta o un menor."
