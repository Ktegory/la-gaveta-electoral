titulo: "Agilizar los expedientes de expulsión de migrantes en situación irregular"
resumen: "Está en el programa (punto 5.2 de inmigración): que las resoluciones de retorno se cumplan cuando corresponda legalmente, «sense expedients eterns», distinguiendo siempre al adulto sin derecho a quedarse del solicitante de asilo, la víctima de trata o el menor. Miriam Nogueras lo defendió el 16 de noviembre en un desayuno de Amics del País en Barcelona. El programa no da plazos."
