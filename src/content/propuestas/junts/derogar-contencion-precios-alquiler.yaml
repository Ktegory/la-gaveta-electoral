titulo: "Derogar los artículos de la Ley 12/2023 de vivienda sobre contención de precios y zonas tensionadas"
resumen: "Punto 2.2 del apartado de jóvenes. Junts quiere derogar los artículos de la ley estatal de vivienda que, según el programa, invaden la competencia exclusiva de Cataluña, empezando por los de contención de precios y zonas tensionadas, que según el programa reducen la oferta de alquiler. Pide también blindar las competencias catalanas ante nuevas leyes estatales."
