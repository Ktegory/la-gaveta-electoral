titulo: "Traspasar Rodalies íntegramente a Cataluña"
resumen: "El programa pide el traspaso «immediat i incondicional» del 100 % de Rodalies y de Media Distancia, con vías, catenarias, estaciones y los presupuestos pendientes de ejecutar. En el debate de RTVE del 8 de noviembre pidió que lo gestione Ferrocarrils de la Generalitat (FGC), según la prensa."
