    cita: "Reclamar el traspàs immediat i incondicional del 100% de Rodalies i Mitjana Distància, amb les vies, les catenàries, les estacions i els pressupostos pendents d’executar per modernitzar-la."
  - fuente: "junts/mesjunts-161-rodalies"
    pagina: "1"
    cita: Davant d’aquesta situació, ha defensat que Catalunya gestioni els seus propis recursos per garantir millors serveis públics, més inversió i manteniment, i el traspàs integral de Rodalies.
  - fuente: "junts/nota-rodalies-puente"
    cita: fer efectiu el traspàs integral de Rodalies, amb vies, trens, estacions i diners; i completar un Corredor Mediterrani que separi el trànsit de mercaderies del de Rodalies.
  - fuente: "junts/prensa-debate-rtve"
    cita: La candidata de Junts ha arrencat demanant el traspàs integral de Rodalies, que passaria a gestionar Ferrocarrils de la Generalitat (FGC).
