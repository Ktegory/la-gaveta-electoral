titulo: "Exigir que el Estado llegue al 0,7 % de la renta nacional bruta en ayuda oficial al desarrollo en 2030"
resumen: "Punto 5.4 del programa. Recuerda que el Estado se ha comprometido a ese objetivo y pide cumplirlo con incrementos presupuestarios verificables y con recursos para la cooperación descentralizada catalana. Las prioridades serían los derechos de las mujeres y de las minorías, la educación, la salud, el agua, la capacitación institucional y el desarrollo económico local."
