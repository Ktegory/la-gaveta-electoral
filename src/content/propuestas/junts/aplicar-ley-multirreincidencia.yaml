    cita: "Garantir l’aplicació efectiva de la Llei orgànica 1/2026 contra la multireincidència, que hem impulsat, amb els mitjans judicials suficients perquè els furts i les estafes reiterats tinguin una resposta ràpida i no quedin impunes. […] Fer efectives les eines de la llei contra la multireincidència als municipis: l’acció penal dels ajuntaments en els casos de furt i les mesures cautelars territorials contra la delinqüència reiterada."
