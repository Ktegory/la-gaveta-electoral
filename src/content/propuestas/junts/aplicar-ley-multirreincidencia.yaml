titulo: "Aplicar la ley de multirreincidencia con más medios judiciales y con acción penal de los ayuntamientos en los hurtos"
resumen: "Puntos 6.1 del apartado de justicia y 6.1 y 6.2 del mundo local. Se refieren a la Ley Orgánica 1/2026, que Junts dice haber impulsado: piden que los hurtos y estafas reiterados tengan respuesta rápida, hacer seguimiento de la ley y que los ayuntamientos ejerzan la acción penal y usen las medidas cautelares territoriales."
