comprobacion:
  estado: encontrada
  nota: "La nota de junts.cat del 7 nov dice además que Nogueras «ha situat aquesta reivindicació com una de les condicions imprescindibles per negociar amb Junts després de les eleccions del 29 de novembre». La SER habla solo de «que Catalunya gestioni els seus impostos», sin nombrar el concierto. Ampliada el 13 nov con la nota de junts.cat de ese día (busca «disposició addicional»); lo de los tipos, el pago por servicios y la solidaridad está en la frase siguiente (busca «capacitat normativa»)."
