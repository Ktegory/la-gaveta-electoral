titulo: "Traspasar a la Generalitat la Seguridad Social y la gestión de las prestaciones por desempleo"
resumen: "Figura en las listas de competencias que Junts reclama en bienestar y en economía. El punto 1.3 de bienestar lo formula como desplegar las competencias de gestión en protección social que sean jurídicamente viables, con sus recursos. La gestión del paro se integraría con el Servei d’Ocupació de Catalunya (SOC)."
