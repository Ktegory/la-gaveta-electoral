resumen: "Puntos 2.3 y 4.1 del apartado de inmigración. Pide criterios de arraigo exigentes que incluyan el catalán, que ninguna regularización se haga al margen de la lengua del país y trámites ágiles y previsibles para los permisos y las renovaciones."
