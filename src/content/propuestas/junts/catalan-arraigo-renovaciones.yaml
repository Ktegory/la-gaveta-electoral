    cita: "Fer que els permisos i les renovacions funcionin, amb tràmits àgils i previsibles, i establir criteris d’arrelament exigents que incloguin el coneixement del català. […] Exigir el coneixement del català en els processos d’arrelament i de renovació dels permisos, i que cap regularització no es faci d’esquena a la llengua del país."
