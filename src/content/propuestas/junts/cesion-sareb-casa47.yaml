titulo: "Ceder gratis a la Generalitat y a los ayuntamientos las viviendas y el suelo de la Sareb y Casa 47 en Cataluña"
resumen: "Punto 5.2 del apartado de vivienda. La cesión sería en propiedad y no solo en gestión, con un fondo para acondicionar las viviendas; incluye el suelo estatal en Cataluña para alquiler asequible y un inventario por municipio de viviendas y solares disponibles."
fuentes:
  - fuente: "junts/programa-29n-2026"
    pagina: "18"
    cita: "Exigir la cessió sense cost a la Generalitat i als ajuntaments de la totalitat dels habitatges i el sòl que la SAREB i Casa 47 tenen a Catalunya, en propietat i no només en gestió, amb un fons específic per […] i fer-los habitables. També cal cedir el sòl de titularitat estatal situat a Catalunya per construir-hi habitatge de lloguer assequible. L’Estat ha de facilitar a cada ajuntament un inventari actualitzat dels habitatges i solars disponibles al seu municipi, perquè en puguin planificar l’ús."
