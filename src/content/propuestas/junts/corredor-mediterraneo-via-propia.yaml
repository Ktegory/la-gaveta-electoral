titulo: "Exigir presupuesto y calendario verificables para el Corredor Mediterráneo, con vía propia en ancho europeo"
resumen: "Puntos 4.3 del apartado internacional y 2.2 de infraestructuras. Pide una vía independiente, en ancho europeo y fuera de los núcleos urbanos, rechaza un tercer carril sobre la línea convencional de pasajeros y reclama también los accesos ferroviarios a los puertos y las conexiones transfronterizas."
fuentes:
  - fuente: "junts/programa-29n-2026"
    pagina: "28"
    cita: "Compromisos pressupostaris i calendaris verificables per al Corredor Mediterrani, les connexions transfrontereres i els accessos ferroviaris als ports, més capacitat catalana de governança aeroportuària i serveis duaners i d’inspecció adequats al comerç exterior."
  - fuente: "junts/programa-29n-2026"
    pagina: "72"
    cita: "Exigir a l’Estat espanyol que compleixi el calendari d’execució del Corredor Mediterrani. Ha de ser una via independent, amb ample europeu i fora dels nuclis urbans, i en cap cas un tercer fil sobre la línia convencional de passatgers."
