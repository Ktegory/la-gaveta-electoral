titulo: "Permitir que la declaración de las víctimas de violencia machista se haga como prueba preconstituida para no repetirla"
resumen: "Punto 2.1 del programa, para evitar la revictimización. La declaración se podría hacer como prueba preconstituida cuando la ley lo permita, con atención judicial especializada."
