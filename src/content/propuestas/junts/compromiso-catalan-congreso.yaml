titulo: "Proponer a los cabezas de lista en Cataluña un compromiso para usar siempre el catalán en el Congreso"
resumen: "Es un compromiso entre candidatos, «El català, cosa de tots», con cuatro puntos: hablar siempre en catalán en el Congreso, presentar en catalán las iniciativas escritas, defender que se siga hablando en la cámara y dar prioridad al catalán en las iniciativas sobre educación, con la inmersión lingüística, y sobre justicia."
