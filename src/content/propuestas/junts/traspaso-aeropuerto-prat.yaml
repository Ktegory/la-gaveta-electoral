titulo: "Traspasar a la Generalitat el aeropuerto del Prat, la red de puertos y las carreteras del Estado en Cataluña"
resumen: "Puntos 2.1 y 3.1 del apartado de infraestructuras. Los aeropuertos catalanes saldrían del modelo centralizado de AENA, con una gobernanza catalana para que el Prat funcione como gran conexión intercontinental. Cataluña gestionaría también la red de puertos y de ferrocarriles de mercancías, y recibiría toda la red de carreteras del Estado, autopistas y nacionales incluidas, con los recursos para mantenerla."
fuentes:
  - fuente: "junts/programa-29n-2026"
    pagina: "72"
    cita: "Traspassar a la Generalitat les competències i la titularitat de l’Aeroport del Prat i de la resta d’aeroports catalans, fora del model centralitzat d’AENA, amb una governança catalana que permeti al Prat operar com a hub intercontinental de primer ordre."
  - fuente: "junts/programa-29n-2026"
    pagina: "71"
    cita: "Gestionar plenament la xarxa de ports i de ferrocarrils de mercaderies, perquè els ports de Barcelona, Tarragona i Palamós es connectin amb els corredors logístics europeus i el Corredor Mediterrani sense dependre dels terminis de l’Estat espanyol."
  - fuente: "junts/programa-29n-2026"
    pagina: "72"
    cita: "Reclamar el traspàs integral de la xarxa de carreteres de titularitat estatal a Catalunya."
  - fuente: "junts/programa-29n-2026"
    pagina: "71"
    cita: "Reclamar el traspàs integral de la xarxa de carreteres de titularitat estatal a Catalunya, incloses les autopistes i carreteres nacionals, amb la transferència dels recursos econòmics necessaris per garantir-ne la gestió, el manteniment, la modernització i la seguretat viària"
