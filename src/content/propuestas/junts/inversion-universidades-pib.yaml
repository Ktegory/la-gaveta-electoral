titulo: "Aumentar la inversión en universidades del 0,40 % al 0,6 % del PIB en cinco años"
resumen: "Punto 2.4 del apartado de educación. Lo justifica con países de tamaño medio parecido al de Cataluña (Austria, Dinamarca, Suecia, Finlandia, Escocia, Irlanda), que según el programa dedican alrededor del 1 % del PIB. No precisa qué administración haría el gasto."
