titulo: "Promover un compromiso plurianual de apoyo humanitario, financiero y militar a Ucrania, con control parlamentario"
resumen: "Punto 3.1 del programa. Incluye aplicar de forma efectiva las sanciones a Rusia y apoyar la adhesión de Ucrania a la UE según los criterios exigibles. Defiende una paz justa, la integridad territorial de Ucrania, incluida Crimea, y el rechazo a las anexiones por la fuerza, sin imponer a los ucranianos una rendición negociada por terceros."
