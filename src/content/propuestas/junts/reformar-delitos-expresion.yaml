titulo: "Suprimir el delito de injurias y restringir los de enaltecimiento del terrorismo y de odio"
resumen: "Punto 1.3 del programa. Propone adecuar el enaltecimiento del terrorismo a los estándares europeos y restringir sustancialmente su alcance, reformar los delitos de odio para que no criminalicen ideas, religiones o instituciones y suprimir el delito de injurias."
