titulo: "Incluir la lengua y el origen territorial como motivos de discriminación y sancionar abusos por lengua o símbolos"
resumen: "Punto 1.4 del programa. Incluye proteger frente a la discriminación laboral o en el acceso a prestaciones, sancionar abusos de los poderes públicos (retirada de banderas o símbolos lícitos, prohibición de cánticos en una lengua, identificaciones o registros por lengua, ideología o simbología) y llevar estas garantías al ámbito deportivo."
