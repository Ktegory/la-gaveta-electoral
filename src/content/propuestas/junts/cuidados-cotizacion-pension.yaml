titulo: "Reconocer mejor en la cotización los periodos en que se deja el trabajo o se reduce la jornada para cuidar"
resumen: "Punto 1.2 del programa, para combatir la brecha de género en las pensiones y la protección social. Afectaría a quienes dejan temporalmente el trabajo o reducen la jornada para cuidar de los hijos o de otros familiares, para que esos periodos no generen desigualdades permanentes."
fuentes:
  - fuente: "junts/programa-29n-2026"
    pagina: "33"
    cita: "Combatre la bretxa de gènere en les pensions i la protecció social. La maternitat i les cures no poden rebaixar la pensió. Els períodes en què una persona deixa temporalment la feina o en redueix la jornada per tenir cura dels fills o d’altres familiars s’han de reconèixer millor en el càlcul de la cotització, perquè no generin desigualtats permanents."
