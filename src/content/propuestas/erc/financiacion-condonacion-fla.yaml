titulo: "Aprobar un modelo de financiación como el pactado en enero de 2026 y condonar más de 17.100 millones del FLA"
resumen: "Según el programa, el nuevo modelo supondría 4.700 millones de euros anuales más para Cataluña, y la condonación, un ahorro de unos 1.500 millones anuales en intereses para la Generalitat."
