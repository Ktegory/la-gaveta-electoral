comprobacion:
  estado: encontrada
  nota: "La parte del modelo de financiación está en la medida 23 de la misma página: «el passat gener de 2026 es va acordar un nou model de finançament amb el Govern de l’Estat», con «uns ingressos addicionals de 4.700 MEUR anuals». El programa pide cambios de modelo «en el sentit dels acords esmentats», no dice literalmente «aplicar» el modelo (el título lo decía; se corrigió el 11 nov). El ahorro de unos 1.500 millones anuales en intereses aparece en la medida 24."
