titulo: "Derogar todas las normas inspiradas en el Pacto Verde Europeo y en la Agenda 2030"
resumen: "Lo pidió en el Congreso en abril de 2026, antes de la campaña, en una proposición no de ley sobre Mercosur y el campo. Cita en especial la Estrategia de la Granja a la Mesa y la Estrategia por la Biodiversidad, y pide un estudio sobre el impacto de esas políticas en España."
