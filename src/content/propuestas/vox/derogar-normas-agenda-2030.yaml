titulo: "Revertir las normas inspiradas en el Pacto Verde y la Agenda 2030, como la prohibición de los motores de combustión"
resumen: "Incluye la prohibición de los motores de combustión y los impuestos a las emisiones de CO2. En abril de 2026 ya pidió en el Congreso derogar todas las normas inspiradas en el Pacto Verde y en la Agenda 2030."
