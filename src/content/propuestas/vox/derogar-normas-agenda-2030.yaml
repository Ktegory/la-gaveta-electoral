    cita: "3. Rechazar frontalmente el Pacto Verde Europeo ante las graves consecuencias que está teniendo para la economía española, en especial para nuestro sector primario. De igual modo, promover la derogación de todas las normas inspiradas en el mismo y en la Agenda 2030, especialmente la Estrategia de la Granja a la Mesa y la Estrategia por la Biodiversidad."
