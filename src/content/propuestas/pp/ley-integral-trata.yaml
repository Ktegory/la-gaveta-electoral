titulo: "Aprobar una ley integral contra la trata de seres humanos"
resumen: "Está en el programa del PP (medida 29): una ley integral contra la trata para proteger a las víctimas y perseguir a las redes, criterios comunes en toda España contra la mutilación genital femenina y los matrimonios forzados, y un protocolo en puertos, aeropuertos y fronteras para identificar los viajes de riesgo. Cuca Gamarra prometió la ley de trata el 25 de noviembre."
