titulo: "Reforzar la frontera sur con más agentes, presencia estable de Frontex y apoyo de las Fuerzas Armadas"
resumen: "Medida 36 del programa. Refuerzo permanente de la Guardia Civil y la Policía Nacional en Canarias, Baleares, Ceuta, Melilla, el Estrecho y los principales aeropuertos; rechazo en frontera también para las entradas a nado en Ceuta y Melilla, y apoyo de las Fuerzas Armadas cuando lo exija la seguridad nacional. En El Hierro, Feijóo concretó más patrulleras para la Guardia Civil, tecnología satelital y drones."
