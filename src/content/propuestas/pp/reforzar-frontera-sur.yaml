  nota: "Ronda manual del 19 nov a las 14:15. Cotejada en el PDF del programa (descargado de nuevo, misma sha256 cea8f2a0…): busca «presencia estable de Frontex» en la página 21, medida 36; la frase de las Fuerzas Armadas cierra la medida. La segunda fuente es la nota del PP del 19 nov sobre Alma Ezcurra en Arrecife (busca «fronteras seguras»); es redacción del partido, no palabras textuales de Ezcurra. Lo de juzgar delitos en alta mar va aparte, en pp/juzgar-delitos-alta-mar. 20 nov (ronda de las 20:04 y cotejo manual): añadida como tercera fuente la nota del PP sobre Feijóo en El Hierro (20 nov, 16:29), que concreta los medios; busca «patrulleras». Es redacción del partido. Vuelve a firmarse."
