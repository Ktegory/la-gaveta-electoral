  nota: "Borrador de la ronda automática del 26 nov a las 20:04. Medida del programa que Feijóo destacó el 26 nov en la reunión con ATA y CEAJE. Programa: medida 161, busca «tras el permiso tendrán bonificada»; cotejada el 26 nov a las 21:07 con el PDF oficial (sha256 cea8f2a0…): la ronda la situó en la pág. 57, pero está en la 56 (la página impresa coincide con la del PDF); cita literal. Nota del PP: busca «dos años posteriores al permiso»; es resumen de la nota en tercera persona (la duplicación «la la» está en el original), no frase literal de Feijóo; consultada en pp.es (API de WordPress) a las 20:15 y vuelta a cotejar a las 21:07. Feijóo ya la había anunciado en su plan de autónomos de noviembre de 2025 (prensa de entonces)."
