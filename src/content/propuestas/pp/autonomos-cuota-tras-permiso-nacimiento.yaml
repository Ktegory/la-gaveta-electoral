titulo: "Bonificar al 100 % durante dos años la cuota de los autónomos que vuelvan a su actividad tras el permiso por nacimiento"
resumen: "Está en el programa del PP (medida 161): los autónomos que retomen su actividad tras el permiso por nacimiento tendrían bonificada al 100 % su cuota durante dos años, y en el caso de las autónomas la exención cubriría también los periodos de lactancia que queden fuera de esa bonificación. La misma medida incluye incentivos a las empresas por los trabajadores con hijos pequeños y más ayudas para contratar a quien sustituya a madres o padres durante sus permisos. Alberto Núñez Feijóo lo destacó el 26 de noviembre en una reunión con ATA y CEAJE."
