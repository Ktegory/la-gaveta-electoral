titulo: "Dejar a los ayuntamientos gastar sus remanentes de tesorería en vivienda si cumplen objetivos de construcción"
resumen: "Está en el programa del PP: ligar la mejora de la financiación local y un uso más flexible del superávit y los remanentes de tesorería a que los ayuntamientos cumplan objetivos de suelo y de vivienda pública y asequible. Feijóo lo destacó el 23 de noviembre en una entrevista en Informativos Telecinco. No ha concretado esos objetivos ni cuánto podrían gastar."
