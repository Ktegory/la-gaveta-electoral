titulo: "Hacer gratuita la escuela infantil de 0 a 3 años, con el Estado y las comunidades pagando cada uno la mitad de la plaza"
resumen: "El Estado financiaría la mitad del coste de cada plaza de 0 a 3 años, pública o concertada, y las comunidades autónomas la otra mitad. Al terminar la legislatura sería gratuita para todas las familias que la soliciten."
