titulo: "Derogar el decreto eléctrico de los centros de datos y lanzar un plan de choque de inversión en la red"
resumen: "Alberto Nadal anunció en Zaragoza que el PP derogaría el real decreto que fija los requisitos de los centros de datos en el sistema eléctrico y lo sustituiría por otra regulación. El plan de choque está en el programa (medida 230): anticipar la capacidad eléctrica en zonas industriales, logísticas y tecnológicas, para viviendas y centros de datos, y resolver en 18 meses lo que frena su conexión a la red. Nadal dio un plazo de 12 a 18 meses, con prioridad para la vivienda y después para los proyectos más avanzados y que creen más empleo. La derogación del decreto no está en el programa."
