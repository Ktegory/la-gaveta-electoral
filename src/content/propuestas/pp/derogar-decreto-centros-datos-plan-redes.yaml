  nota: "Borrador de la ronda automática del 25 nov a las 8:04. Cotejada el 25 nov a las 9:55 con la nota del PP del 24 nov (20:32) sobre la rueda de prensa de Nadal en Zaragoza: la frase citada está entrecomillada; la derogación (busca «se derogará») y el plazo de 12 a 18 meses (busca «entre 12 y 18 meses») están en el resumen de la nota. El plan de choque está en el programa del PP (PDF, sha256 cea8f2a0…): medida 230, pág. 72, busca «En 18 meses resolveremos»; la derogación del decreto, no. Por eso la nota es la fuente principal y la fecha, la del 24 nov. Subtema «Precio de la energía», como la medida de la industria electrointensiva: no hay uno de redes eléctricas."
