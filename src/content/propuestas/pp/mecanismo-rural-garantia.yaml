titulo: "Aplicar el Mecanismo Rural de Garantía para que ninguna norma se apruebe sin evaluar su impacto en el medio rural"
resumen: "Forma parte de la medida del programa «Vivir en el medio rural tendrá futuro», que también promete bajar los impuestos a quienes viven, invierten y producen en el medio rural. Feijóo lo repitió en Vallfogona de Balaguer (Lleida) al presentar un pacto nacional por la agricultura."
