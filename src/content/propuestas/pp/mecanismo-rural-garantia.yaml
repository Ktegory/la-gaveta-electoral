  nota: "Pista de las rondas del 13 nov (Gamarra en Navarrete) y del 16 nov (nota de Lleida), que no se redactó por falta de subtema. Cotejada el 22 nov a las 21:30 en el programa (sha256 cea8f2a0…, copia local, sin cambios): medida 196, pág. 64; busca «Mecanismo Rural de Garantía». La nota de Lleida, descargada de nuevo el 22 nov, lo dice en estilo indirecto; busca «impacto en la economía rural». El PSOE (medida 276) y el FA (pág. 109) también lo llevan en su programa, pero no lo han destacado en campaña."
