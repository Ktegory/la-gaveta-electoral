  nota: "Borrador de la ronda automática del 25 nov a las 14:03. Medida del programa que el PP destacó en el 25N. Programa: medida 28, pág. 19, busca «LAS MUJERES NO QUEDARÁN DESPROTEGIDAS»; cotejada el 25 nov a las 15:25 con el PDF oficial (sha256 cea8f2a0…): la ronda la situó en la pág. 20 y está en la 19 (la página impresa coincide con la del PDF). Las citas de las dos notas, también cotejadas a esa hora en pp.es. Nota del PP del 25 nov (9:35): busca «auditoría completa»; es el resumen de la nota, no una frase entrecomillada, pero Feijóo lo escribe en primera persona en Instagram («llevar a cabo una auditoría completa sobre el escándalo de las pulseras»). Nota del PP sobre Sémper en RNE (25 nov, 10:56): busca «Viogén». La auditoría no está en el programa."
