titulo: "Pasar al Ministerio del Interior el sistema de pulseras antimaltrato y auditar sus fallos"
resumen: "Está en el programa del PP (medida 28): garantizar la fiabilidad de los dispositivos que vigilan las órdenes de alejamiento, que el sistema dependa del Ministerio del Interior con supervisión continua de las fuerzas de seguridad y conservar íntegros sus datos como prueba. El 25 de noviembre, Feijóo se comprometió a hacer una auditoría completa de los fallos de las pulseras y Borja Sémper propuso reforzar VioGén y vincularlo con Interior. No detalla quién haría la auditoría ni en qué plazo."
