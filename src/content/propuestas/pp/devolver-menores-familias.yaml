titulo: "Reformar la ley para devolver a sus familias a los menores que han entrado de forma irregular"
resumen: "El programa prevé reformar la Ley de Extranjería y la legislación de protección de menores para priorizar la reunificación familiar y el retorno a sus países, resolver en 72 horas la determinación de la edad y castigar en el Código Penal el fraude de edad. En El Hierro, según la nota del PP, Feijóo habló de modificar la Ley Penal del Menor."
