  nota: "Ronda automática del 20 nov a las 20:04, con la nota del PP del 20 nov (16:29; busca «Ley Penal del Menor»; es redacción del partido, no palabras textuales de Feijóo). Cotejada después en el programa (sha256 cea8f2a0…, copia local, sin cambios): medida 46, págs. 23-24, «Promoveremos el regreso de los menores con sus familias como objetivo prioritario»; busca «priorizar la reunificación familiar». El programa no menciona la Ley Penal del Menor, sino la Ley de Extranjería y la legislación de protección de menores; por eso el resumen recoge las dos formulaciones."
