titulo: "Bonificar la cuota del autónomo con enfermedad grave desde el primer día y ampliar el cese de actividad"
resumen: "Está en el programa del PP (medida 172): el autónomo con una enfermedad grave tendría bonificada la cuota desde el primer día de baja, se ampliarían los supuestos de la prestación por cese de actividad con menos burocracia y se ampliarían los umbrales de protección de la Ley de Segunda Oportunidad. Juan Bravo lo destacó el 25 de noviembre en Sevilla."
