titulo: "Blindar los descuentos al transporte de los residentes en Canarias"
resumen: "Feijóo lo prometió en Santa Cruz de Tenerife, junto con más vivienda y obras hidráulicas para Canarias, en colaboración con el Gobierno canario. No ha detallado qué descuentos ni cómo se blindarían."
