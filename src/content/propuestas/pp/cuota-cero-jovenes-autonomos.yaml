titulo: "Eximir de la cuota de autónomos el primer año a los nuevos autónomos, y el segundo si no llegan al salario mínimo"
resumen: "Los nuevos autónomos no pagarían cuota a la Seguridad Social el primer año, ni el segundo si sus ingresos no llegan al salario mínimo. En el mitin con los jóvenes del 13 de noviembre lo presentó para los jóvenes autónomos y añadió que se bonificarían las cotizaciones del primer año si contratan a un trabajador."
