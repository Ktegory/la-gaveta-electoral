  nota: "Añadida el 27 nov a las 11:50, a petición de la persona responsable, tras la revisión de la ronda de las 08:04, que la había dejado como compromiso genérico. Programa: medida 82, busca «DEVOLVERÁN LO ROBADO»; cotejada con la copia local del PDF oficial (sha256 cea8f2a0…, igual que la del YAML de la fuente): está en la pág. 34 (número impreso arriba, coincide con la página del PDF); cita literal. Europa Press: entrada de las 23:32 del minuto a minuto del debate a cuatro, busca «penas de malversación»; frase entrecomillada de Feijóo, cotejada el 27 nov. El compromiso de no indultar a condenados por corrupción ya está publicado en su propia propuesta del PP, en el mismo subtema."
