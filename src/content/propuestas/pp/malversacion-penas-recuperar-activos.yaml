titulo: "Restablecer las penas por malversación y reforzar la oficina que recupera los bienes procedentes de delitos"
resumen: "Está en el programa del PP (medida 82): restablecer las penas por malversación, reforzar la Oficina de Recuperación y Gestión de Activos para localizar y administrar los bienes procedentes de delitos e incorporar a la legislación española el marco penal europeo contra la corrupción. Alberto Núñez Feijóo lo destacó en el debate a cuatro del 26 de noviembre: «Las penas de malversación no se van a volver a rebajar»."
fuentes:
  - fuente: "pp/programa-29n-2026"
    pagina: "34"
    cita: "LOS CORRUPTOS DEVOLVERÁN LO ROBADO. Restableceremos las penas por malversación. Reforzaremos la Oficina de Recuperación y Gestión de Activos para localizar y administrar los bienes procedentes de los delitos que se hayan cometido. Incorporaremos sin demora a la legislación española el marco penal europeo contra la corrupción para reforzar la persecución de estos delitos y el castigo a sus responsables."
  - fuente: "pp/prensa-debate-a-cuatro-2026-11-26"
    cita: "Las penas de malversación no se van a volver a rebajar. Yo no voy a indultar a ningún político condenado por corrupción. Los corruptos van a devolver lo robado."
