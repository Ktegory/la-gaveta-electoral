titulo: "Averiguar en un máximo de siete días la identidad de quien llega de forma irregular"
resumen: "El programa prevé comprobar en un máximo de una semana la identidad de quienes sean interceptados al cruzar la frontera de forma irregular y si suponen un riesgo para la seguridad, y tramitar después con rapidez el asilo o la devolución que corresponda. Feijóo lo repitió en Santa Cruz de Tenerife junto con determinar la edad en 72 horas (ya en pp/devolver-menores-familias) y desplegar las Fuerzas Armadas cuando lo exija la seguridad nacional (ya en pp/reforzar-frontera-sur)."
