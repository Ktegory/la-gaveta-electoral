titulo: "Permitir que la jurisdicción española juzgue los delitos cometidos en alta mar durante las travesías migratorias"
resumen: "Alma Ezcurra lo planteó en Arrecife (Lanzarote) al hablar de la ruta atlántica. Al día siguiente, en El Hierro, Feijóo habló de cambiar el Código Penal con nuevos tipos delictivos para juzgar a las mafias que trafican con personas. Ezcurra pidió también una ley migratoria adaptada al Pacto Europeo de Migración y Asilo, más apoyo de Frontex y trabajar con los países de origen."
fuentes:
  - fuente: "pp/nota-ezcurra-lanzarote-2026-11-19"
    cita: "Plantea que la jurisdicción española pueda juzgar delitos cometidos en alta mar y denuncia las atrocidades que, según afirma, se producen durante las travesías"
  - fuente: "pp/nota-feijoo-el-hierro-2026-11-20"
    cita: "dará toda la batalla en el ámbito internacional para que nuestro Código Penal señale nuevos tipos delictivos y juzgue a las mafias que trafican con seres humanos"
