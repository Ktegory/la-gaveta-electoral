titulo: "Permitir que la jurisdicción española juzgue los delitos cometidos en alta mar durante las travesías migratorias"
resumen: "Alma Ezcurra lo planteó en Arrecife (Lanzarote) al hablar de la ruta atlántica. En la misma intervención pidió una ley migratoria adaptada al Pacto Europeo de Migración y Asilo, más apoyo de Frontex y trabajar con los países de origen."
