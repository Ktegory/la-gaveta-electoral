  nota: "Cita cotejada el 19 nov (ronda de las 14:15) en la nota oficial del PP sobre Alma Ezcurra en Arrecife. Estilo indirecto de la propia nota. Busca «alta mar». Ronda manual del mismo día: buscado «alta mar» en el PDF del programa (misma sha256 cea8f2a0…) y no aparece; solo está en la nota. La nota no detalla qué delitos ni cómo se cambiaría la ley. 20 nov (ronda de las 20:04 y cotejo manual): añadida como segunda fuente la nota del PP sobre Feijóo en El Hierro (20 nov, 16:29); busca «toda la batalla». Es redacción del partido; en la misma nota Feijóo dice entre comillas «Vamos a intentar cambiar nuestro Código Penal y las mafias tienen que pagar». No habla de alta mar de forma expresa. Vuelve a firmarse."
