titulo: "Aprender a leer y escribir en papel y priorizar de 3 a 12 años el aprendizaje sin pantallas individuales"
resumen: "Es la medida 210 del programa del PP, que estaba en blanco en el documento publicado y se conoció el 25 de noviembre. Propone que la lectura y la escritura se aprendan en papel y que de los 3 a los 12 años se priorice el aprendizaje sin pantallas individuales en el aula, de acuerdo con las comunidades autónomas. El alumnado que necesite un dispositivo de apoyo por discapacidad lo seguiría teniendo."
