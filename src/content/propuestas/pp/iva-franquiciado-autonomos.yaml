  nota: "Borrador de la ronda automática del 25 nov a las 20:04. Medida del programa que el PP destacó el 25 nov. Programa: medida 171, busca «FACTURAS MENOS DE 85.000»; cotejada el 25 nov a las 21:15 con el PDF oficial (sha256 cea8f2a0…): pág. 59, cita literal. Nota del PP del 25 nov (16:07): busca «85.000 euros»; es resumen de la nota salvo lo entrecomillado; cotejada en pp.es a las 21:15. La misma nota dice que al contratar la cotización será cero el primer año y del 50 % el segundo (busca «durante el primer año»). Ampliada el 26 nov a las 21:11: Feijóo destacó ese día, en la reunión con ATA y CEAJE, la declaración anual única para quienes inicien su actividad, que está en la misma medida 171 (pág. 59, busca «una vez al año», cotejada con el PDF oficial); se añade al resumen y a la cita del programa, con la nota del PP como fuente (busca «única declaración anual»; resumen de la nota, no frase literal). Vuelve a necesitar firma."
