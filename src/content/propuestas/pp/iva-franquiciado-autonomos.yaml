titulo: "Eximir de cobrar y declarar el IVA a los autónomos que facturan menos de 85.000 € al año"
resumen: "Está en el programa del PP (medida 171): los autónomos que facturen menos de 85.000 euros no cobrarían ni declararían el IVA, podrían pasar de cuatro declaraciones trimestrales a dos semestrales (y quienes inicien su actividad, a una sola al año) y se bonificaría el 100 % de las cotizaciones empresariales por el primer trabajador durante un año y el 50 % por el segundo. Carmen Fúnez lo destacó el 25 de noviembre, y Alberto Núñez Feijóo, la declaración anual única para quienes empiezan, el 26 de noviembre."
