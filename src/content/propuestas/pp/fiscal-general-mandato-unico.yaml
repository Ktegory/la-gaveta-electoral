  nota: "Borrador de la ronda automática del 27 nov a las 08:04. Medida del programa que Feijóo destacó en el debate a cuatro del 26 nov. Programa: medida 70, busca «mandato único de cinco años»; cotejada el 27 nov con la copia local del PDF oficial que bajó una sesión anterior (sha256 cea8f2a0…, igual que la del YAML de la fuente): está en la pág. 31 (número impreso arriba, coincide con la página del PDF); cita literal. Europa Press: entrada de las 23:32 del minuto a minuto, busca «no va a ser un ministro»; es frase entrecomillada de Feijóo. Ojo: la frase de Feijóo («no va a ser un ministro») no aparece tal cual en la medida 70, que no prohíbe expresamente nombrar a exministros; por eso el título sigue al programa. La primera frase de la cita (jueces eligen a jueces) ya está publicada en pp/jueces-eligen-jueces."
