partido: "pp"
tema: "instituciones"
subtema: "justicia"
titulo: "Dar al fiscal general un mandato único de cinco años y hacer vinculante el informe del CGPJ sobre su idoneidad"
resumen: "Está en el programa del PP (medida 70), que propone un nuevo Estatuto del Ministerio Fiscal: el fiscal general no cesaría con el Gobierno que lo propuso, el informe del Consejo General del Poder Judicial sobre su idoneidad sería preceptivo y vinculante, y su procesamiento supondría el cese inmediato. Alberto Núñez Feijóo lo destacó en el debate a cuatro del 26 de noviembre: «El fiscal general del Estado no va a ser un ministro»."
fuentes:
  - fuente: "pp/programa-29n-2026"
    pagina: "31"
    cita: "Aprobaremos un nuevo Estatuto del Ministerio Fiscal. El fiscal general tendrá un mandato único de cinco años y, como recomienda la Comisión Europea, no cesará con el Gobierno que lo propuso. El informe del Consejo General del Poder Judicial sobre su idoneidad será preceptivo y vinculante para su nombramiento. Su procesamiento conllevará el cese inmediato y automático."
  - fuente: "pp/prensa-debate-a-cuatro-2026-11-26"
    cita: "Los jueces van a elegir otra vez a los jueces. El fiscal general del Estado no va a ser un ministro."
