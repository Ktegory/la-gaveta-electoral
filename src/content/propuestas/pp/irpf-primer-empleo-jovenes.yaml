titulo: "Eximir del IRPF el primer año a los jóvenes de 18 a 35 años y reducirlo un 75 %, 50 % y 25 % los tres siguientes"
resumen: "Para los trabajadores y autónomos de 18 a 35 años, durante los cuatro primeros años en que paguen IRPF: no pagarían el primero y tendrían una reducción del 75 %, el 50 % y el 25 % en los tres siguientes. Se aplicaría desde la primera declaración tras aprobarse la ley."
