titulo: "Evitar que la industria electrointensiva asuma el 80 % de los peajes eléctricos y darle el 25 % de los derechos de CO₂"
resumen: "Alberto Nadal las presentó como dos de las tres «medidas urgentes» para la industria que más electricidad consume. La tercera, quitar el impuesto del 7 % a la generación eléctrica, ya la recogemos aparte. También pidió un plan de choque de inversiones en la red eléctrica."
