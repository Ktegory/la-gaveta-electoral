  nota: "Ronda automática del 20 nov a las 20:04, con la nota del PP del 20 nov (16:29; busca «tendrán fondos de cooperación», frase entrecomillada de Feijóo). Cotejada después en el programa (sha256 cea8f2a0…, copia local, sin cambios): medida 45, pág. 23; busca «no coopera en las readmisiones». La medida 247 (pág. 76) añade que la cooperación al desarrollo «debe ser un instrumento de estabilización de los países que contribuya a disminuir la inmigración irregular»."
