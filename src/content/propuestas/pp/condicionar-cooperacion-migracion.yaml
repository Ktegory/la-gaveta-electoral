titulo: "Condicionar visados y cooperación al desarrollo a que los países de origen colaboren contra la inmigración irregular"
resumen: "El programa lo liga a las readmisiones: al país que no coopere se le condicionarán los visados, la cooperación al desarrollo y la posición de España en la política comercial europea. En El Hierro, Feijóo lo planteó como fondos de cooperación solo para los países que frenen la inmigración irregular."
