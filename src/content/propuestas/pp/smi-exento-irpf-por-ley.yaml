  nota: "Borrador de la ronda automática del 26 nov a las 14:04. Medida del programa que Jaime de Olano destacó el 26 nov en la Diputación Permanente. Programa: medida 177, busca «Quien cobre el salario mínimo»; cotejada el 26 nov a las 14:28 con el PDF oficial (sha256 cea8f2a0…): pág. 60, cita literal. Nota del PP: busca «lo garantizará por ley»; es resumen de la nota en tercera persona, no frase literal de De Olano; cotejada en pp.es a las 14:28. La nota también dice que el PP actualizará los mínimos personales y familiares y deflactará los tramos (medidas 177 y 178; la 178 ya está publicada)."
