titulo: "Fijar por ley que quien cobre el salario mínimo no pague IRPF, con un umbral que suba con el SMI"
resumen: "Está en el programa del PP (medida 177): quien cobre el salario mínimo no pagaría IRPF, y por ley el umbral de tributación subiría automáticamente cada vez que suba el SMI. La misma medida incluye elevar los mínimos personales y familiares y bajar el IRPF de las rentas medias y bajas. Jaime de Olano lo destacó el 26 de noviembre en la Diputación Permanente del Congreso."
fuentes:
  - fuente: "pp/programa-29n-2026"
    pagina: "60"
    cita: "Quien cobre el salario mínimo no pagará IRPF: por ley, el umbral subirá automáticamente cada vez que suba el SMI, para que ningún Gobierno pueda volver a cobrar impuestos a quien menos gana por el simple hecho de no tocar una cifra."
  - fuente: "pp/nota-de-olano-diputacion-permanente-2026-11-26"
    cita: "Critica que el Ejecutivo utilice de nuevo un decreto para eliminar el IRPF en la subida del Salario Mínimo y recuerda que el PP lo garantizará por ley"
