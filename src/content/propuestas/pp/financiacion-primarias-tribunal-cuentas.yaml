  nota: "Borrador de la ronda automática del 27 nov a las 14:15. Cotejado ese día en Europa Press (busca «exclusivamente a través de las cuentas del partido»); la cita es texto del programa que reproduce la agencia. No está en el PDF publicado (copia local, sha256 cea8f2a0…: no aparece «primarias»), así que es una de las medidas en blanco. Probablemente es la 83, la única en blanco del apartado 2.4 «La política nunca será un negocio» (pág. 34, entre la 82 de malversación y la 84 de control del gasto), pero la agencia no da el número: no lo pongo hasta que lo confirme el PP. El PDF de pp.es no ha cambiado (last-modified 10 nov 11:19 GMT; la versión de 64 págs., 11 nov 09:54 GMT) y pp.es no tiene nota sobre ella a las 14:30. Subtema: va en Justicia, como las otras medidas del PP contra la corrupción (malversación, indultos); valorar si encaja mejor en Organismos independientes. Si el PP publica el texto, pasar el programa o la nota a fuente principal. Revisado de nuevo el 27 nov a las 14:40: cita literal en el teletipo; en el PDF, la pág. 34 tiene el hueco «Permanezca atento a la campaña» con el número 83, entre la 82 (malversación) y la 84 («Ningún euro público quedará fuera de control»). La única nota de pp.es de hoy que habla de primarias (Feijóo, 10:44) no menciona la medida."
revisadaPor: "Khiustin Tornés"
