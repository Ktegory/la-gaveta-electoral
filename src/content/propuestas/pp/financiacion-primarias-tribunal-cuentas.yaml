titulo: "Financiar las primarias de los partidos solo con las cuentas del partido y someterlas al Tribunal de Cuentas"
resumen: "Es una medida del programa del PP que estaba en blanco en el documento publicado y se conoció el 27 de noviembre. Propone reformar la Ley de Financiación de los Partidos Políticos para que los procesos internos de elección de los dirigentes se paguen solo a través de las cuentas del partido, con ingresos y gastos declarados y fiscalizados por el Tribunal de Cuentas. Según el PP, la ley actual regula las campañas electorales y las cuentas anuales de los partidos, pero no el dinero de las primarias."
