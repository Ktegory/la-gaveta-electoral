titulo: "Exigir cinco años fuera de la política para ser magistrado del Tribunal Constitucional"
resumen: "Está en el programa del PP, que añade un régimen estricto de incompatibilidades y que el Constitucional no sea una segunda instancia sobre el Tribunal Supremo. Feijóo lo destacó el 23 de noviembre en Antena 3: el plazo valdría para cualquier cargo político, sea local, provincial, autonómico o nacional."
