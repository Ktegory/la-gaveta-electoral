titulo: "Establecer controles obligatorios sobre los precios y márgenes de las grandes distribuidoras de alimentos"
resumen: "Los controles alcanzarían también a los intermediarios. El programa añade más inspección y sanciones contra las prácticas comerciales abusivas, medidas contra la reduflación y un Observatorio de la Cadena Alimentaria que siga precios, costes y márgenes."
