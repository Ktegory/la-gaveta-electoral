titulo: "Reclamar «todas las capacidades y competencias en materia migratoria» para desarrollar una respuesta propia"
resumen: "Lo planteó su portavoz en el Congreso, Mertxe Aizpurua, en el debate sobre la crisis de Ceuta."
fuentes:
  - fuente: "bildu/nota-politica-migratoria-2026-09-03"
    cita: "Para ello, ha reclamado todas las capacidades y competencias en materia migratoria: «no para gestionar las políticas que decida el Gobierno español de turno, sino para poder decidir y desarrollar una respuesta propia»."
