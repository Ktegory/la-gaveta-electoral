  estado: encontrada
  nota: "Las competencias se reclaman para Euskal Herria (frase anterior de la nota). «Todas las capacidades y competencias en materia migratoria» es redacción de la nota, no una cita literal de Aizpurua entre comillas: si el título lo pone entre comillas, conviene quitarlas o añadir «para Euskal Herria»."
