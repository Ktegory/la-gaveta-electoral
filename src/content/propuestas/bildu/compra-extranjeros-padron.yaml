    cita: "Condicionar la compra de vivienda por parte de extranjeros multipropietarios a la inscripción en el padrón municipal durante al menos los 2 años previos a la compra de vivienda. El inmueble adquirido deberá dedicarse a vivienda habitual y efectiva del propietario o a alquiler regulado bajo los índices de precios de referencia."
