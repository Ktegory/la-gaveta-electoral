titulo: "Exigir a los extranjeros con varias viviendas dos años de empadronamiento antes de comprar otra"
resumen: "La vivienda comprada tendría que ser la residencia habitual del propietario o alquilarse a precio regulado según los índices de referencia. El programa también condiciona la compra de edificios enteros a que se destinen a alquiler regulado y prohíbe comprarlos con fines turísticos o especulativos."
