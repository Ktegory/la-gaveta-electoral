    cita: "Apostar por una renovación integral de las vías en aquellos corredores en los que es posible ofrecer una alternativa de renovación a la Alta Velocidad (especialmente el corredor navarro y la conexión de la CAPV con Burgos). Desarrollar la alternativa bajo el principio de “una plataforma, tres servicios” donde, además de un servicio de media y larga distancia de velocidad alta (200 km/h) se garantice un servicio de cercanías de calidad y la posibilidad de transportar mercancías."
