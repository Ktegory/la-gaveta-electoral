titulo: "Renovar las vías como alternativa a la alta velocidad en el corredor navarro y en la conexión del País Vasco con Burgos"
resumen: "Seguiría el principio de «una plataforma, tres servicios»: trenes de media y larga distancia a 200 km/h, cercanías y transporte de mercancías."
