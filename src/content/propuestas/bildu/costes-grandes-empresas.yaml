titulo: "Que las grandes energéticas, petroleras y alimentarias asuman las subidas de costes en épocas de inflación"
resumen: "Para que, en situaciones de inflación o de crisis de abastecimiento, las subidas de productos y servicios básicos no recaigan en la ciudadanía."
fuentes:
