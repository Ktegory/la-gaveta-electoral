titulo: "Obligar a las grandes empresas energéticas y alimentarias a absorber parte de las subidas de costes en las crisis"
resumen: "Sería un mecanismo de intervención extraordinaria sobre sus márgenes, para que en emergencias, crisis de abastecimiento o subidas extraordinarias de costes no trasladen esas subidas de forma desproporcionada a los precios finales. Notas anteriores de EH Bildu mencionaban también a las petroleras."
