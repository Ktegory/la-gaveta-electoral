    cita: "Establecer un mecanismo de intervención extraordinaria sobre los márgenes de las grandes empresas de los sectores energético y alimentario, que impida que, en situaciones de emergencia, crisis de abastecimiento o incrementos extraordinarios de costes, trasladen de forma desproporcionada dichas subidas a los precios finales al consumidor"
  - fuente: "bildu/nota-alquiler-precios-2026-11-09"
    cita: Propondremos que sean las grandes empresas energéticas, petroleras y alimentarias quienes, con sus enormes márgenes de beneficio, deban asumir y absorber, en situaciones inflacionarias y de crisis de abastecimiento, el aumento de los costes de estos productos y servicios básicos.
  - fuente: "bildu/nota-smi-mercabilbao-2026-11-13"
    cita: "Queremos que esas grandes empresas, que cada trimestre nos anuncian sus miles de millones de ganancias, asuman el aumento de los costes con esos enormes márgenes de beneficio."
