titulo: "Prohibir la compra especulativa de vivienda"
fuentes:
  - fuente: "bildu/nota-decretos-vivienda-2026-09-30"
    cita: Por ello, EH Bildu mantiene la exigencia de aprobar medidas estructurales como los contratos indefinidos, la protección permanente frente a los desahucios, la prohibición de la compra especulativa y una regulación estructural de los precios.
  - fuente: "bildu/nota-alquiler-precios-2026-11-09"
    cita: Durante su intervención, Oskar Matute ha anunciado que EH Bildu impulsará en el Congreso será recuperar la prórroga automática de los contratos de alquiler y poner fin a la compra especulativa de vivienda.
