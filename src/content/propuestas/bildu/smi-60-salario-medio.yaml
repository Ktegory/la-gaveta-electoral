titulo: "Permitir que cada comunidad fije su propio salario mínimo, con el estatal como mínimo legal"
resumen: "Se haría reformando el Estatuto de los Trabajadores. La suficiencia de las cuantías se fijaría por ley con la referencia de la Carta Social Europea. En notas anteriores, EH Bildu concretaba esa referencia en el 60 % del salario medio."
