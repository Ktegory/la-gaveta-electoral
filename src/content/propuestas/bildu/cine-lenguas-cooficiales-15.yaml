titulo: "Destinar al menos el 15 % del Fondo de Protección de la Cinematografía a proyectos en lenguas distintas del castellano"
resumen: "La reserva sería para proyectos en lenguas oficiales distintas del castellano, como el euskera. También propone blindar por ley las ayudas a las producciones en esas lenguas."
