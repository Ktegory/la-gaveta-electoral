titulo: "Reducir la jornada de forma progresiva hasta las 32 horas semanales sin reducción salarial"
resumen: "Como primer paso, jornada de 37,5 horas en 2026 y de 35 horas en el sector público, sin compensarla con horas extraordinarias. En los contratos a tiempo parcial subiría en proporción el salario por hora."
