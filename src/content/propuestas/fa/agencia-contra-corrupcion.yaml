titulo: "Crear una Agencia Independiente contra la Corrupción con capacidad de investigar y sancionar"
resumen: "Un organismo independiente con capacidad para investigar e imponer sanciones administrativas. Tendría un buzón anónimo de denuncias, podría trasladar a la Fiscalía los casos con indicios de delito y colaboraría con los jueces y con las instituciones estatales y autonómicas."
