titulo: "Fijar un tipo mínimo efectivo del 20 % en Sociedades para las grandes empresas y grupos"
resumen: "Se aplicaría sobre el resultado contable ajustado, por encima del mínimo actual del 15 %, sin subir la carga fiscal de las pymes. El programa también propone suprimir el régimen de consolidación fiscal de los grandes grupos."
