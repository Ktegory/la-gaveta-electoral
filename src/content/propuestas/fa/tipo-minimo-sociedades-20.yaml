    cita: "Impondremos un tipo mínimo efectivo del 20 % sobre el resultado contable ajustado para las grandes empresas y grupos corporativos, avanzando sobre el mínimo previo del 15 % mediante reglas homogéneas que eviten la manipulación de la base tributaria, sin elevar la carga fiscal de las pymes."
