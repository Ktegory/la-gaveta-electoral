titulo: "Crear una prestación universal por crianza de 200 € al mes por cada menor de 18 años"
resumen: "Sería un derecho del menor, inembargable y sin depender de los ingresos de los padres, abonado cada mes por la Agencia Tributaria como deducción reembolsable del IRPF. Se implantaría en tres fases por edades durante la legislatura."
