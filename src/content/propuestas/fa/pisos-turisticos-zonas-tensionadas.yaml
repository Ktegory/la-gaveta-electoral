titulo: "Extinguir en 3 años las licencias de pisos turísticos en edificios residenciales de zonas tensionadas"
resumen: "Afectaría también a los alquileres de temporada fraudulentos. Los pisos turísticos pasarían a pagar el IVA general del 21 %, perderían deducciones en Sociedades e IRPF y tendrían un recargo de hasta el 150 % en el IBI. Los alquileres de 30 días o menos se considerarían turísticos."
