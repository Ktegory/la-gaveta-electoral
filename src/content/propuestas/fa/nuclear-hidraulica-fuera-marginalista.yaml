titulo: "Sacar la nuclear y la hidroeléctrica del sistema marginalista de fijación del precio de la luz"
resumen: "Se cambiaría la ley para fijar un precio máximo de retribución a ambas tecnologías y acabar con los «beneficios caídos del cielo». Antes, una auditoría pública calcularía los costes reales de cada tecnología."
fuentes:
