subtema: "justicia"
titulo: "Prohibir durante 20 años contratar con la Administración a las empresas condenadas por corrupción"
resumen: "Reformar la Ley de Contratos del Sector Público (artículo 72.6) y el Código Penal (artículo 33.7.f) para que las empresas condenadas por corrupción no puedan obtener contratos públicos durante 20 años. La prohibición alcanzaría también a sus representantes y administradores, a las sociedades vinculadas y a las UTE en las que participen."
