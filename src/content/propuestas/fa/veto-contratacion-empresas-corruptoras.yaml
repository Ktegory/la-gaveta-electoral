titulo: "Prohibir durante 20 años contratar con la Administración a las empresas condenadas por corrupción"
resumen: "Las empresas y personas condenadas por corrupción no podrían contratar con el sector público durante veinte años. Según su nota del 13 de noviembre, se haría reformando la Ley de Contratos del Sector Público (artículo 72.6) y el Código Penal (artículo 33.7.f), y la prohibición alcanzaría también a sus representantes y administradores, a las sociedades vinculadas y a las UTE en las que participen."
