titulo: "Crear un abono único mensual de transporte para todo el Estado, con Cercanías a 20 € al mes"
resumen: "Cercanías costaría 10 € para menores de 26 años y sería gratis para menores de 16. Habría descuentos del 60-70 % en Media Distancia, del 50 % en Larga Distancia para viajes recurrentes y del 75-80 % en autobús y metro, o una tarifa plana combinada de 50 € al mes. El transporte público sería gratis en Canarias, Illes Balears, Ceuta y Melilla."
fuentes:
  - fuente: "fa/programa-29n-2026"
    pagina: "72"
    cita: "Crearemos un abono único nominativo y mensual válido en todo el Estado, ciudades y modos de transporte. Incluye un esquema de precios de 20 €/mes para Cercanías (10 € para menores de 26 años y gratuito para menores de 16), descuentos del 60-70 % en Media Distancia (gratuito para menores de 15 años), 50 % en Larga Distancia para viajes recurrentes (al menos 3 viajes de ida y vuelta al mes) y 75-80 % de descuento en autobús y metro municipal/autonómico (o tarifa plana combinada de 50 €/mes)."
