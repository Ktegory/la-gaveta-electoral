comprobacion:
  estado: encontrada
  nota: "Pista de la ronda del 23 nov (20:04) con la publicación de @elfrenteamplio del 23 nov (busca «PISO o MASCOTA»). Cotejada el 23 nov a las 22:30 en el programa del Frente Amplio (versión del 23 nov, sha256 d7e2c815…): apartado de bienestar animal, página 91 (83 del PDF; en la versión del 17 nov, página 83). Busca «declarando nulas las cláusulas». El programa pasa a fuente principal y la publicación queda como segunda fuente. La misma publicación repite el IVA veterinario al 10 %, ya recogido en «fa/iva-panales-veterinarios-peluquerias»."
