titulo: "Anular las cláusulas de los contratos de alquiler que prohíban tener animales de compañía"
resumen: "El programa lo limita a las cláusulas que lo prohíban de forma genérica en los contratos de vivienda habitual. El Frente Amplio lo destacó en Instagram el 23 de noviembre, junto con otras medidas sobre animales. No dice si afectaría a los contratos ya firmados."
fuentes:
  - fuente: "fa/programa-29n-2026"
    pagina: "91"
    cita: "Acabaremos con la discriminación de los animales en el alquiler, declarando nulas las cláusulas que prohíban de forma genérica tener animales de compañía en los contratos de arrendamiento de vivienda habitual."
  - fuente: "fa/instagram-animales-alquiler-2026-11-23"
    cita: "Ya no tendrás que elegir entre PISO o MASCOTA: vamos a anular las cláusulas que prohíban tener animales de compañía en los contratos de alquiler."
