titulo: "Aprobar una Ley Integral de Salud Obstétrica que tipifique la violencia obstétrica"
resumen: "Está en el programa del Frente Amplio: reconocer el embarazo, el parto y el posparto como procesos naturales, tipificar la violencia obstétrica, crear un canal de denuncia confidencial y garantizar por ley el acompañamiento, el libre movimiento y el alivio del dolor, con una matrona por mujer en parto activo en un máximo de cinco años. El partido lo destacó en Instagram el 25 de noviembre."
