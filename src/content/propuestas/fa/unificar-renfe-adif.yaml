titulo: "Unificar Renfe y Adif en un solo operador público ferroviario"
resumen: "Es la primera medida del «Pacto de Estado por el Tren» que propone el Frente Amplio, para coordinar trenes e infraestructuras. El partido cita como modelo a Francia, Italia, Austria y Suiza."
