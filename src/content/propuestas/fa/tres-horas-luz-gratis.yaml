titulo: "Dar tres horas de luz gratis al día a todos los hogares en la franja de más producción solar"
resumen: "Las ofrecería una comercializadora pública y las grandes comercializadoras estarían obligadas por ley a incluirlas. La CNMC sancionaría las subidas en el resto del día que las compensen. Los peajes de red de esas horas se pagarían con el gravamen a las grandes energéticas."
