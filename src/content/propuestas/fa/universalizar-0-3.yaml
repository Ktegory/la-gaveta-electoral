titulo: "Universalizar la educación de 0 a 3 años con plaza pública gratuita para toda familia que la pida"
resumen: "El primer ciclo de Infantil se integraría del todo en el sistema educativo. Se reformaría el Real Decreto 132/2010 para fijar un máximo de 4 niños por profesional de 0 a 1 año, 6 de 1 a 2 años y 8 de 2 a 3 años."
