titulo: "Destinar el 8 % del PIB a la sanidad pública"
resumen: "Como compromiso fijado desde los Presupuestos Generales del Estado, dentro de un modelo de sanidad 100 % pública y de gestión directa. En un acto en Pamplona, el candidato por Navarra lo presentó junto con reforzar la atención primaria y frenar la privatización de servicios."
