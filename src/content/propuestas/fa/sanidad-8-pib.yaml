  nota: "Ronda del 22 nov (14:04), con el teletipo de Europa Press Navarra (busca «compromiso central»; resumen de la agencia con dos entrecomillados). Cotejada el 22 nov a las 17:15 en el programa corregido (sha256 516c5c6c…, copia local, sin cambios): pág. 30 impresa (26 del PDF), apartado 2.4; busca «Blindaje del gasto sanitario público». La introducción del programa (pág. 7 del PDF) habla de una sanidad «100 % pública, universal y de gestión directa con un suelo del 8 % del PIB». Va en «Sanidad pública y privada» porque el programa la enmarca en la gestión pública; la del PSOE (7 % del PIB) está en «Listas de espera» porque su programa la liga a ellas."
