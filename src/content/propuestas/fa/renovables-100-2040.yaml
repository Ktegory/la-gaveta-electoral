titulo: "Llegar al 100 % de electricidad de origen renovable en 2040"
resumen: "Con objetivos intermedios del 81 % en 2030 y del 90 % en 2035, medidos sobre la generación eléctrica total. Rosa Martínez lo presentó antes en nombre del Frente Amplio, junto con una empresa pública de energía y el calendario actual de cierre nuclear."
