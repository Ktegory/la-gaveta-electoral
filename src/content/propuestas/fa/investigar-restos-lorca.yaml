titulo: "Financiar la búsqueda de los restos de Federico García Lorca y de las demás víctimas asesinadas en Granada en 1936"
resumen: "Un proyecto de investigación histórica, arqueológica y forense, con prospecciones en lugares todavía no investigados, para identificar a las víctimas. El programa lo incluye en la protección de los lugares de memoria democrática, junto a un Centro de Memoria en la antigua cárcel de Carabanchel."
