  nota: "Ronda del 22 nov (14:04), con el teletipo de Europa Press Asturias (busca «tope máximo de 600 euros»; resumen de la agencia). Cotejada el 22 nov a las 17:15 en el programa corregido (sha256 516c5c6c…, copia local, sin cambios): pág. 13 impresa (10 del PDF), la misma de fa/inversion-vivienda-publica; busca «máximo de 600 €». El límite del 25 % de la renta sigue en la misma frase. La bajada del 32 % del alquiler medio que cita el teletipo no está en el programa y no se recoge."
