titulo: "Fijar un máximo de 600 euros al mes para el alquiler de la vivienda pública"
resumen: "El tope sería para un piso tipo de 80 m², y el precio se ajustaría al coste de la vida de cada territorio para que el alquiler no supere el 25 % de la renta. En un acto en Grado (Asturias), el candidato por Asturias lo presentó junto con el objetivo de 1,5 millones de viviendas públicas (en fa/inversion-vivienda-publica)."
