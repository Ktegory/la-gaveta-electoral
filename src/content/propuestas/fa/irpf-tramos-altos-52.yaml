titulo: "Crear más tramos del IRPF desde 120.000 euros y subir el tipo máximo al 52 % a partir de 300.000 euros"
resumen: "Los tipos marginales subirían de forma progresiva. En el mismo apartado, el programa propone acercar la tributación de las rentas del capital a la del trabajo y eliminar el régimen especial de los trabajadores desplazados y las deducciones por planes de pensiones privados individuales."
