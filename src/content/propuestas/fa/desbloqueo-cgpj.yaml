titulo: "Elegir a los vocales judiciales del CGPJ por mayoría absoluta si en dos meses no hay acuerdo"
resumen: "Se mantendría la mayoría de tres quintos en la primera votación. Si en dos meses no hay acuerdo, las Cámaras podrían elegirlos en segunda votación por mayoría absoluta. El nuevo Consejo podría constituirse aunque falten los vocales del turno de juristas."
