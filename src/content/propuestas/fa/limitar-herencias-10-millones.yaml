    cita: "Limitaremos las herencias de los ultrarricos a un máximo de 10 millones de euros por heredero."
  - fuente: "fa/nota-programa-herencias-2026-11-16"
    cita: "Esta limitación se implementará estableciendo un tipo impositivo marginal del 100 % sobre el tramo de la base imponible que supere esa cifra en el Impuesto sobre Sucesiones y Donaciones."
