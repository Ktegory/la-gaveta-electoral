titulo: "Limitar las herencias a 10 millones de euros por heredero con un tipo del 100 % en Sucesiones"
resumen: "Lo que supere esa cifra tributaría al 100 % en Sucesiones, contando las donaciones recibidas en vida y sin bonificaciones autonómicas. En la nota de presentación del programa añadía un tramo del 75 % entre 5 y 10 millones y una bajada de tipos por debajo de 120.000 €."
