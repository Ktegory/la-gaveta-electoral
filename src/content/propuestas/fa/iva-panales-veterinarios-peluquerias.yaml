titulo: "Bajar el IVA de los pañales, los servicios veterinarios y las peluquerías"
resumen: "El programa detalla los tipos: peluquerías y servicios veterinarios pasarían del tipo general al reducido, y los pañales, del reducido al superreducido. Los productos sin gluten tendrían IVA cero. En Instagram, el Frente Amplio lo resume como «tipo superreducido» para los tres."
fuentes:
  - fuente: "fa/programa-29n-2026"
    pagina: "60"
    cita: "Bajaremos el IVA de bienes y servicios básicos de consumo general. Las peluquerías y los servicios veterinarios pasarán del tipo general al reducido, los pañales del reducido al superreducido y los productos sin gluten tendrán IVA cero para compensar su mayor precio."
  - fuente: "fa/instagram-ipc-iva-2026-11-17"
    cita: "Bajada del IVA de lo básico: 0% en luz, agua y gas para consumos bajos, y tipo superreducido en pañales, veterinarios y peluquerías."
