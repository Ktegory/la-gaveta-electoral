comprobacion:
  estado: encontrada
  nota: "Borrador de la ronda del 17 nov (20:04) a partir del pie de la publicación de @elfrenteamplio (busca «tipo superreducido»). Cotejada después en el programa (PDF oficial, versión del 17 nov, sha256 516c5c6c…), apartado 3.4, página 52 (47 del PDF); el texto ya estaba en la versión del 16 nov. El programa distingue los tipos y no coincide del todo con la publicación de Instagram: el resumen lo explica. Busca «pasarán del tipo general al reducido». El IVA de la luz según consumo ya está en «fa/iva-luz-progresivo». Retitulada y renombrada (antes «iva-panales-veterinarios-peluquerias»); quitada la firma para revisar de nuevo. 23 nov: el FA publicó otra versión del PDF (sha256 d7e2c815…) que añade un apartado de deporte; la cita no cambia y pasa a la página 60."
