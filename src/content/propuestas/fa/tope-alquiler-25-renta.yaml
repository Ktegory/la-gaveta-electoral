titulo: "Limitar el alquiler en zonas tensionadas al 25 % de la renta media del barrio o al índice SERPAVI, si es menor"
resumen: "Se aplicaría por ley en todas las zonas tensionadas. El programa calcula una bajada media del 35 % sobre los precios actuales. En municipios de más de 200.000 habitantes o con masificación turística severa habría una rebaja adicional obligatoria del 30 % sobre el valor regulado."
