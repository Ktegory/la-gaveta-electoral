titulo: "Permitir una sola declaración informativa anual del IVA a quien facture menos de 85.000 € al año"
resumen: "Quien facture menos de 85.000 € al año podría elegir una declaración informativa anual en lugar de la trimestral. El Frente Amplio propone además trasponer de inmediato la directiva europea del IVA franquiciado."
fuentes:
