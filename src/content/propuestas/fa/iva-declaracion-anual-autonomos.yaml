    cita: "Aquellos que facturen menos de 85.000 euros anuales podrán optar por quedar exentos de liquidaciones periódicas y presentar una única declaración informativa anual en lugar de las trimestrales."
  - fuente: "fa/instagram-autonomos-2026-11-15"
