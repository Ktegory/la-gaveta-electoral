titulo: "Reformar el Estatuto de los Trabajadores para que todos los salarios se revisen conforme al IPC"
resumen: "Los convenios tendrían que incluir cláusulas de revisión salarial que mantengan el poder adquisitivo; si un convenio no la recoge, los salarios pactados se revisarían igualmente conforme al IPC."
fuentes:
  - fuente: "fa/nota-salarios-ipc-2026-11-17"
    cita: "modificaremos el Estatuto de los Trabajadores para que sea obligatorio incluir cláusulas de revisión salarial que preserven el poder adquisitivo. La reforma introducirá además una previsión de aplicación subsidiaria: cuando un convenio colectivo no recoja esa cláusula, las retribuciones pactadas se revisarán igualmente conforme al IPC."
  - fuente: "fa/programa-29n-2026"
    pagina: "57"
    cita: "Modificaremos el Estatuto de los Trabajadores para que los convenios colectivos incluyan obligatoriamente cláusulas de revisión salarial que preserven el poder adquisitivo. Cuando el convenio no las prevea, las retribuciones pactadas se revisarán de forma subsidiaria conforme al IPC: si suben los precios, suben los salarios."
fechaAnuncio: "2026-11-16"
