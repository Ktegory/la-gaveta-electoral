  nota: "17 nov (ronda automática de las 14:00): cotejada en la nota oficial del Frente Amplio del mismo día. Busca «modificaremos el Estatuto de los Trabajadores». También está en el programa (PDF oficial, sha256 df6e4d96…), apartado 4.1, página 51 del PDF; no lleva número impreso y es la anterior a la 58, así que se cita como 57. Busca «cláusulas de revisión salarial» (cotejo del 17 nov). 17 nov (tarde): la versión nueva del PDF (sha256 516c5c6c…) añade un punto propio, «Cláusulas de revisión salarial ligadas al IPC», en la misma página; la cita es ahora ese punto. Quitada la firma para revisar de nuevo."
