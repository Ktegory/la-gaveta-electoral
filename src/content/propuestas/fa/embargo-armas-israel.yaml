titulo: "Aprobar una ley de embargo integral y permanente de armas a Israel"
resumen: "Mejoraría el Real Decreto-ley 10/2025: sin excepciones que pueda autorizar el Gobierno y vigente mientras persista la ocupación ilegal o el riesgo de genocidio. Cerraría el tránsito militar por puertos, aeropuertos, espacio aéreo y bases, y prohibiría contratar o cooperar con la industria de defensa israelí, también a través de terceros países."
