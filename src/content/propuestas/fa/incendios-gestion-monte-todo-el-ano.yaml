titulo: "Crear un cuerpo civil climático con empleo público para prevenir los incendios en invierno y cuidar el territorio"
resumen: "Está en el programa del Frente Amplio: un cuerpo público y estable, dentro del Plan de Empleo Garantizado, que se dedique a cuidar el territorio, prevenir incendios en invierno y apagarlos en verano, restaurar ríos y acuíferos, adaptarse a sequías e inundaciones y asesorar a quien quiera pasarse a la agricultura regenerativa. El partido lo destacó en Instagram el 24 de noviembre como «apagar los incendios en invierno». No detalla cuántas personas lo formarían ni con qué presupuesto."
