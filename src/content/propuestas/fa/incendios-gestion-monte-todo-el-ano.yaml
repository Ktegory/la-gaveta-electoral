  nota: "Pista de la ronda del 24 nov (20:04) con la publicación de @elfrenteamplio del 24 nov (busca «Apagar los incendios en invierno»; texto comprobado de nuevo a las 21:30). Cotejada el 24 nov a las 21:30 en el programa del Frente Amplio (PDF, sha256 d7e2c815…): apartado 5.1, «Creación de un cuerpo civil climático», pág. 80 impresa (72 del PDF), busca «cuerpo civil climático». El programa pasa a fuente principal y la publicación queda como segunda fuente. El programa recoge además una estrategia estatal de prevención de grandes incendios forestales (pág. 85) y un Plan de Empleo Forestal en zonas de grandes incendios (pág. 105), que no se añaden aquí."
