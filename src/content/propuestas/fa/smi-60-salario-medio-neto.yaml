titulo: "Fijar por ley un suelo permanente del salario mínimo en el 60 % del salario medio neto"
resumen: "El salario mínimo subiría de forma progresiva y nunca bajaría de ese suelo. Además, se prohibiría de forma explícita que se absorba o compense con complementos o pluses salariales."
