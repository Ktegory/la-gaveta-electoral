titulo: "Impuesto del 10 % sobre el valor de las viviendas acumuladas"
resumen: "Para empresas desde la primera vivienda y para personas físicas desde la cuarta, si el valor total supera 800.000 €. Quedan fuera las viviendas que se alquilen de forma asequible y estable."
