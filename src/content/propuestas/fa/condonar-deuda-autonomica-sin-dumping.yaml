titulo: "Condonar deuda a las comunidades autónomas a cambio de no bajar impuestos a las rentas altas"
resumen: "Las comunidades podrían dedicar el 20 % de la deuda condonada a ampliar su parque público de alquiler asequible. El resto de la deuda se reestructuraría con más plazo y menos interés, y en seis meses se calcularían los déficits de financiación acumulados desde el modelo de 2001 para compensarlos."
