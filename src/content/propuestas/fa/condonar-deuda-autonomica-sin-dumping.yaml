    cita: "Condonación de deuda autonómica condicionada a la prohibición de efectuar dumping fiscal o bajadas de impuestos a rentas altas. Podrán destinar el 20 % de la deuda que se les condone a crear y ampliar su parque público de alquiler asequible."
