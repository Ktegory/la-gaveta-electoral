titulo: "Invertir cada año el 1 % del PIB en un parque público de 1,5 millones de viviendas y pasar la SAREB a Casa 47"
resumen: "Unos 17.000 millones de euros al año. El objetivo es sumar 1,5 millones de viviendas públicas en 12 años (125.000 al año) y llegar al 20 % del parque en 2035. Todas las fincas y suelos residenciales de la SAREB pasarían a la empresa pública Casa 47."
