    pagina: "58"
    cita: "Implantaremos un registro horario digital, fiable e interoperable que recoja la jornada real y sus interrupciones, garantizando el acceso remoto en tiempo real para la Inspección de Trabajo sin desplazamientos previos."
  - fuente: "fa/nota-acto-barcelona-2026-11-21"
    cita: "Si el PSOE quiere copiarnos medidas del programa electoral, como el registro horario para que la gente deje de hacer horas extras gratis, le decimos que no hace falta que nos copie: basta con que las publique directamente en el BOE"
