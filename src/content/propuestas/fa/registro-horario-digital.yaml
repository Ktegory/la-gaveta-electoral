titulo: "Implantar un registro horario digital al que la Inspección de Trabajo pueda acceder en remoto y en tiempo real"
resumen: "El programa prevé un registro de jornada digital, fiable e interoperable que recoja la jornada real y sus interrupciones, con acceso remoto en tiempo real para la Inspección de Trabajo. Prohibiría usar datos biométricos y la geolocalización permanente para el control horario. En el acto de Barcelona, Ernest Urtasun lo presentó como una medida para que la gente deje de hacer horas extras gratis."
