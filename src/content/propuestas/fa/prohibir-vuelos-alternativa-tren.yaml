titulo: "Prohibir los vuelos nacionales con alternativa en tren de 2,5 horas"
resumen: "Quedarían fuera los vuelos que conectan con vuelos internacionales. El programa añade una tasa progresiva a los viajeros frecuentes y frenaría las ampliaciones de aeropuertos incompatibles con los objetivos climáticos."
