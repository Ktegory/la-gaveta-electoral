  nota: "Cita cotejada el 16 nov en el programa del Frente Amplio (PDF oficial, sha256 df6e4d96…), página 75 (página 68 del PDF), punto «Reducción de vuelos domésticos de corto radio». Busca «alternativa competitiva en tren de 2,5 horas». La tasa a viajeros frecuentes está en el punto siguiente («Fiscalidad verde al sector aéreo y transportes de lujo»). 23 nov: el FA publicó otra versión del PDF (sha256 d7e2c815…) que añade un apartado de deporte; la cita no cambia y pasa a la página 83."
