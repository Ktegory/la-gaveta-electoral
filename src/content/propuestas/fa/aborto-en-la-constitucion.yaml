titulo: "Reformar el artículo 43 de la Constitución para incluir el derecho al aborto"
resumen: "El texto obligaría a los poderes públicos a garantizar la interrupción voluntaria del embarazo con los servicios necesarios. Además, una estrategia aseguraría el aborto en centros públicos de todas las comunidades, con los gastos de desplazamiento incluidos."
