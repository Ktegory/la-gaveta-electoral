titulo: "Hacer progresivo el IVA de la luz, el agua y el gas, con un 0 % en el consumo básico"
resumen: "En la luz, el IVA dependería del consumo por persona, del 0 % al 21 %. El 0 % se aplicaría a los consumos más bajos, a las personas en situación de vulnerabilidad y al autoconsumo. Los consumos eléctricos vitales también tendrían un tipo reducido en el Impuesto Especial sobre la Electricidad. El programa solo detalla la luz; el agua y el gas los añadió el partido en Instagram el 19 de noviembre, sin concretar los tramos."
