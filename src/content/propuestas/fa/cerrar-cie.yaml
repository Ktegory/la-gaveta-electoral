titulo: "Cerrar los Centros de Internamiento de Extranjeros (CIE)"
resumen: "En el asilo en frontera, la detención sería solo un último recurso, con prioridad para las medidas alternativas. El programa también propone derogar el «rechazo en frontera» de la Ley de Extranjería y crear un mecanismo independiente de control de derechos humanos en la Frontera Sur."
