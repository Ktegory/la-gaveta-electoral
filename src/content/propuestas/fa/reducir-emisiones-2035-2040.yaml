titulo: "Reducir las emisiones un 38 % en 2035 y un 85 % en 2040 respecto a 1990"
resumen: "La neutralidad climática llegaría en 2050. Los objetivos entrarían en la legislación climática y en la planificación energética, con sendas por sectores para evaluar su cumplimiento. Forma parte de una revisión al alza del Plan Nacional Integrado de Energía y Clima (PNIEC)."
