titulo: "Eximir del ITP la compra de la primera vivienda habitual, con un tope de ingresos y de precio"
resumen: "La exención total tendría un tope máximo de ingresos del comprador y de precio de la vivienda. A la vez, el ITP tendría un recargo del 200 % en la compra de la segunda propiedad y del 1.000 % a partir de la tercera."
fuentes:
  - fuente: "fa/programa-29n-2026"
    pagina: "21-22"
    cita: "En el marco del Impuesto sobre Transmisiones Patrimoniales (ITP), se fijará la exención total del tributo para la adquisición de la primera vivienda habitual de familias e individuos […] se aplicará un recargo del 200 % en la adquisición de la segunda propiedad y del 1.000 % a partir de la tercera vivienda."
