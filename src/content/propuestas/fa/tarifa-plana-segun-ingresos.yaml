    pagina: "111"
    cita: "Vincularemos la tarifa plana de 88 euros a los ingresos y no al tiempo. Hoy se pierde a los dos años; la mantendremos mientras los ingresos reales de la persona trabajadora autónoma sean inferiores al SMI anual, sin pérdida de derechos de protección, para que nadie empiece a pagar más antes de que su negocio sea sólido."
  - fuente: "fa/instagram-autonomos-2026-11-15"
    cita: "Proponemos ajustarla a tus ingresos, no al tiempo: que no empieces a pagar más hasta que tu negocio sea sólido."
