  nota: "16 nov: añadimos el programa como fuente principal (página 103; página 92 del PDF). Busca «cotización fija bonificada». Quitada la firma para revisar de nuevo. 17 nov: la versión nueva del PDF (sha256 516c5c6c…) reescribe la medida como «Tarifa plana mientras se ingrese menos del SMI» y fija la cuantía en 88 euros. Cita actualizada; misma página. Busca «Tarifa plana mientras». Quitada la firma para revisar de nuevo. 23 nov: el FA publicó otra versión del PDF (sha256 d7e2c815…) que añade un apartado de deporte; la cita no cambia y pasa a la página 111."
