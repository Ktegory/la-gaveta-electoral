titulo: "Mantener la tarifa plana de autónomos mientras se ingrese menos del SMI, en lugar de limitarla a 2 años"
resumen: "La tarifa plana de 88 € dependería de los ingresos y no del tiempo: se mantendría mientras los ingresos reales sean inferiores al salario mínimo anual, sin perder derechos de protección. Hoy dura 2 años."
fuentes:
