titulo: "Mantener la tarifa plana de autónomos mientras se ingrese menos del SMI, en lugar de limitarla a 2 años"
resumen: "Hoy la tarifa plana de 88 € dura 2 años. El Frente Amplio propone que dependa de los ingresos y no del tiempo: se pagaría esa cuota mientras se cobre menos del salario mínimo. No ha dado más detalles."
