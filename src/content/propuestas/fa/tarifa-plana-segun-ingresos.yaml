titulo: "Mantener la tarifa plana de autónomos mientras se ingrese menos del SMI, en lugar de limitarla a 2 años"
resumen: "Mientras los ingresos reales sean inferiores al salario mínimo anual por causas objetivas, como las condiciones del mercado o el inicio de la actividad, se podría pagar una cotización fija bonificada sin perder derechos de protección. Hoy la tarifa plana de 88 € dura 2 años."
