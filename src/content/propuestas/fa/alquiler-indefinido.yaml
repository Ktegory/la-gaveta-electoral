titulo: "Hacer indefinidos por defecto los contratos de alquiler de vivienda"
resumen: "Mientras se aprueba la ley, los contratos se prorrogarían de forma obligatoria cada 5 años (7 si el casero es una persona jurídica). La no renovación exigiría un preaviso de 6 meses. Si el casero rescinde fuera de los supuestos legales, pagaría una indemnización de 12 mensualidades."
