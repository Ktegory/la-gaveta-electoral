titulo: "Promover un modelo territorial federal y plurinacional que incluya el derecho a decidir en referéndum"
resumen: "El programa lo plantea como objetivo: promover el debate para formar una mayoría que impulse ese cambio y «resolver definitivamente la cuestión territorial». Lo enmarca en el horizonte de un Estado «republicano federal y plurinacional»."
