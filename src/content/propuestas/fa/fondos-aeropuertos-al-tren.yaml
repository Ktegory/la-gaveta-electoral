    cita: "Proponemos destinar al ferrocarril los casi 13.000 millones previstos para ampliar aeropuertos en el Documento de Regulación Aeroportuaria (plan DORA) del Ministerio de Transportes y Movilidad Sostenible."
  - fuente: "fa/nota-tren-2026-11-02"
    cita: "Colau ha propuesto destinar de forma inmediata a la mejora de la red ferroviaria los fondos del plan DORA, que contempla la ampliación de los aeropuertos y suma casi 13.000 millones de euros."
