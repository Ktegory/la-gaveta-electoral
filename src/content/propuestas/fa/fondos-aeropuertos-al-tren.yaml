titulo: "Destinar a la red ferroviaria los fondos del plan DORA de ampliación de aeropuertos"
resumen: "Según el partido, el plan suma casi 13.000 millones de euros. La misma nota pide aumentar la inversión en personal y mantenimiento ferroviario y reforzar cercanías, sin dar cifras."
