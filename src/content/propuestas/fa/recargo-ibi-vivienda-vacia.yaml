    pagina: "127"
    cita: "Modificaremos la Ley de Haciendas Locales de acuerdo con lo aprobado en el Real Decreto 29/2026 para la protección de la función social de la vivienda y la ampliación de la oferta de vivienda asequible para establecer un recargo base del 50 % de la cuota líquida para inmuebles de uso residencial desocupados."
