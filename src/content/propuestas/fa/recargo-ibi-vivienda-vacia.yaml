titulo: "Aplicar un recargo de entre el 50 % y el 150 % en el IBI de las viviendas vacías"
resumen: "El recargo base sería del 50 % de la cuota líquida. Podría llegar al 100 % si el titular tiene cuatro o más viviendas y al 150 % si el inmueble lleva más de tres años vacío. Se haría modificando la Ley de Haciendas Locales; el programa propone un recargo parecido para los pisos turísticos."
fuentes:
