titulo: "Derogar por completo la Ley de Seguridad Ciudadana («ley mordaza»)"
resumen: "Las multas se ajustarían a los ingresos y a la edad de las personas sancionadas, y las sanciones serían de tipo restaurativo o fruto de una conciliación. El programa también propone derogar los delitos contra los sentimientos religiosos, los delitos contra la Corona y el enaltecimiento del terrorismo."
