titulo: "Garantizar por ley que los servicios públicos básicos estén a menos de 30 minutos de quien vive en el medio rural"
resumen: "El criterio de proximidad se fijaría por ley junto con las administraciones territoriales. Está en el capítulo del programa contra la despoblación, que también incluye la II Estrategia estatal frente al Reto Demográfico y un programa de vivienda rural. En Granada, el FA lo presentó con un plan de empleo con incentivos directos y fiscalidad diferenciada."
