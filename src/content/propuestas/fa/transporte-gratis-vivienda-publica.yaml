titulo: "Hacer gratuito el abono de transporte público para quienes vivan en vivienda del parque público estatal"
resumen: "Está en el programa del Frente Amplio: las personas residentes en viviendas del parque público estatal tendrían gratis el abono de transporte público. Pablo Bustinduy lo destacó el 26 de noviembre junto al abono único estatal y el comedor escolar gratuito."
