    pagina: "14"
    cita: "Prohibiremos por ley la compra de viviendas residenciales para cualquier fin que no sea la residencia habitual y permanente de la persona compradora o su arrendamiento bajo el régimen de alquiler asequible regulado. Esta prohibición alcanzará de forma absoluta a cualquier persona jurídica con ánimo de lucro, como fondos buitre, SOCIMIs, inmobiliarias, entidades bancarias y fondos de inversión."
