titulo: "Prohibir por ley comprar vivienda para algo que no sea residir en ella o alquilarla a precio asequible regulado"
resumen: "La prohibición sería absoluta para las personas jurídicas con ánimo de lucro, como fondos, SOCIMI, inmobiliarias y bancos. Además, la empresa pública Casa 47 tendría un derecho de tanteo y retracto para comprar edificios completos y carteras de viviendas antes de su venta privada, por detrás de comunidades y ayuntamientos."
