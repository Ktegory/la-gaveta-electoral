titulo: "Aprobar una ley que haga de la gestión pública directa la vía general en la sanidad y derogar la Ley 15/1997"
resumen: "La gestión indirecta de centros y servicios del Sistema Nacional de Salud sería excepcional y exigiría justificar que la directa no es posible, con evaluación previa de un comité técnico. Se revisarían los contratos de los servicios privatizados para internalizarlos poco a poco."
fuentes:
  - fuente: "fa/programa-29n-2026"
    pagina: "30"
    cita: "Apostaremos de nuevo por una Ley de Gestión Pública e Integridad del Sistema Nacional de Salud para consagrar la gestión pública directa como la vía general para los centros y servicios del Sistema Nacional de Salud (SNS). Derogaremos expresamente la Ley 15/1997, sobre habilitación de nuevas formas de gestión del SNS, que había abierto la puerta a la colaboración con entidades privadas, y los modelos de gestión indirecta pasarán a ser estrictamente excepcionales."
