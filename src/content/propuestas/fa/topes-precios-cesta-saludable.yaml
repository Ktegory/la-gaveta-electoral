titulo: "Fijar precios máximos para los alimentos básicos de la cesta saludable en emergencias o abusos"
resumen: "Los topes se aplicarían solo en situaciones de emergencia o de abuso acreditado. El programa añade un gravamen sobre los márgenes de las grandes empresas de producción y distribución de alimentos, ligado a su evolución desde antes de la pandemia."
