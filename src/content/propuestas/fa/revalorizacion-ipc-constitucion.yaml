  nota: "Cita cotejada el 16 nov en el programa del Frente Amplio (PDF oficial, sha256 df6e4d96…), página 63 (página 57 del PDF), apartado «Blindaje constitucional del carácter público de las pensiones». Busca «revalorización automática con arreglo al IPC». 17 nov: en la versión nueva del PDF (sha256 516c5c6c…) la cita empieza en la página 63 y salta a la 64 tras «las pensiones pú-» (57-58 del PDF). Quitada la firma para revisar de nuevo. 23 nov: el FA publicó otra versión del PDF (sha256 d7e2c815…) que añade un apartado de deporte; la cita no cambia y pasa a las páginas 71-72."
