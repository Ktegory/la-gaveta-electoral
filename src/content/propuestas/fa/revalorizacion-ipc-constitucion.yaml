partido: "fa"
tema: "pensiones"
subtema: "revalorizacion"
titulo: "Incluir en la Constitución la revalorización automática de las pensiones con el IPC"
resumen: "Se haría por el procedimiento ordinario de reforma (artículo 167), sin convocar elecciones. El derecho a la pensión pública pasaría a la sección de derechos y deberes de los ciudadanos, junto con la prohibición de privatizar su gestión."
fuentes:
  - fuente: "fa/programa-29n-2026"
    pagina: "71-72"
    cita: "Para ello, ubicaremos el derecho a la pensión pública y su revalorización automática con arreglo al IPC, que ninguna sea inferior al SMI y que no se privatice la gestión de las pensiones públicas en la Sección 2.ª del Capítulo II del Título I («De los derechos y deberes de los ciudadanos»), elevando significativamente su rango normativo y garantizando su aplicabilidad inmediata sin necesidad de convocar elecciones."
fechaAnuncio: "2026-11-16"
