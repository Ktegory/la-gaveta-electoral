titulo: "Permitir que el Banco Central Europeo financie directamente a los Estados de la UE"
resumen: "Así los países no tendrían que colocar su deuda pública en los mercados financieros. El programa también propone ampliar el mandato del BCE al pleno empleo, la cohesión social y la transición ecológica, y que el Parlamento Europeo nombre a su Comité Ejecutivo."
