titulo: "Reconocer en la Ley de Familias a las personas designadas como referentes de cuidados, aunque no sean parientes"
resumen: "Las amistades y otras personas de confianza podrían ejercer derechos de cuidados, acompañamiento y crianza de menores. El reconocimiento sería voluntario y no impondría obligaciones de cuidado."
