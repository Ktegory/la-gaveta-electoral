titulo: "Impulsar una misión nacional para que una cuarta parte de la superficie agraria se cultive con prácticas regenerativas"
resumen: "Está en el programa del Frente Amplio: 6 millones de hectáreas con prácticas regenerativas en 2030, con técnicos comarcales, fincas demostrativas, un seguro que cubra los riesgos de la transición, compra pública y un sello público «Eco+». El partido la destacó en Instagram el 24 de noviembre como una misión «para las explotaciones pequeñas y medianas»; el programa no habla del tamaño de las explotaciones. No detalla el presupuesto."
