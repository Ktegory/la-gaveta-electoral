  nota: "Pista de la ronda del 24 nov (20:04) con la publicación de @elfrenteamplio del 24 nov (busca «agricultura regenerativa»; texto comprobado de nuevo a las 21:30). Cotejada el 24 nov a las 21:30 en el programa del Frente Amplio (PDF, sha256 d7e2c815…): capítulo «Continuar el impulso hacia una transición ecológica justa», pág. 89 impresa (81 del PDF), busca «Agricultura regenerativa:». El programa pasa a fuente principal y la publicación queda como segunda fuente. Va en «Clima» porque el programa la incluye en el capítulo de transición ecológica; la ronda había propuesto «Despoblación y medio rural»."
