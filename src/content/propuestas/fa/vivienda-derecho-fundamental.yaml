titulo: "Reformar el artículo 47 de la Constitución para que la vivienda sea un derecho fundamental"
resumen: "Podría reclamarse ante los tribunales ordinarios y, mediante recurso de amparo, ante el Tribunal Constitucional. Hasta la reforma, una ley reconocería un derecho subjetivo a la vivienda, empezando por las personas sin hogar, las familias con menores y las víctimas de violencia machista. La reforma también impediría privatizar o vender el parque público de vivienda."
