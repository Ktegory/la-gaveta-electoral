  nota: "16 nov: añadimos el programa como fuente principal (página 16; página 13 del PDF). Busca «huelga de alquileres». Cambia el mecanismo: la nota del 12 nov hablaba de un fondo público; el programa, de consignación judicial. Título y resumen ajustados. Quitada la firma para revisar de nuevo."
