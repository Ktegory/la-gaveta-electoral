partido: "fa"
tema: "vivienda"
subtema: "alquiler"
titulo: "Regular las huelgas de alquiler: depositar la renta en consignación judicial sin riesgo de desahucio"
resumen: "Se podría hacer ante abusos sistémicos o incumplimientos graves de las condiciones de habitabilidad. El depósito de la renta en consignación judicial no podría alegarse como causa de desahucio. En su nota del 12 de noviembre, el Frente Amplio hablaba de depositar la renta en un fondo público."
fuentes:
  - fuente: "fa/programa-29n-2026"
    pagina: "16"
    cita: "Asimismo, regularemos el derecho a la huelga de alquileres en supuestos de abusos sistémicos o incumplimientos graves de las condiciones de habitabilidad, permitiendo el depósito de la renta en consignación judicial sin que ello pueda ser esgrimido como causa judicial de desahucio."
  - fuente: "fa/nota-sindicatos-inquilinas-2026-11-12"
    cita: "El mecanismo propuesto establece que los arrendatarios depositen el 100% del importe de sus alquileres en un fondo público, en lugar de transferirlo directamente a los propietarios."
