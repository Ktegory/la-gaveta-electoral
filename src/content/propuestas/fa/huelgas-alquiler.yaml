titulo: "Regular las huelgas de alquiler: depositar la renta en un fondo público sin riesgo de desahucio por impago"
resumen: "Los inquilinos podrían retener colectivamente el pago directo al propietario ante incumplimientos justificados, como la falta de mantenimiento, depositando el 100 % de la renta en un fondo público. Ese depósito valdría como pago, por lo que no cabría desahucio por impago ni reclamación de intereses. Incluye protección frente a represalias, como no renovar el contrato."
fuentes:
  - fuente: "fa/nota-sindicatos-inquilinas-2026-11-12"
    cita: "El mecanismo propuesto establece que los arrendatarios depositen el 100% del importe de sus alquileres en un fondo público, en lugar de transferirlo directamente a los propietarios."
