titulo: "Reconocer legalmente a los sindicatos de inquilinos y su capacidad para negociar convenios colectivos de alquiler"
resumen: "Cualquier inquilino podría constituir un sindicato de vivienda con un mínimo de tres personas. Los convenios podrían negociarse para un edificio o para ámbitos territoriales más amplios. Según su nota, la medida la planteó antes el Sindicato de Inquilinas y la incluirá en su programa."
