titulo: "Aportar cada año al menos un 2,3 % del PIB adicional al sistema de financiación autonómica"
resumen: "Serían unos 38.000 millones de euros más al año para reforzar los servicios públicos. El nuevo modelo partiría de la propuesta del Gobierno de coalición y mediría las necesidades de gasto con criterios sociales, como los parados sin prestación o la población mayor de 80 años. Ese gasto no computaría en la regla de gasto."
