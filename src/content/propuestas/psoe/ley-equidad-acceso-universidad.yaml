titulo: "Aprobar una Ley de Equidad en el Acceso a la Universidad Pública con financiación plurianual vinculante"
resumen: "La ley fijaría compromisos de financiación plurianuales y vinculantes para las universidades públicas de todas las comunidades autónomas, con mecanismos de seguimiento, y una oferta mínima de plazas públicas en titulaciones estratégicas y de alta demanda."
