comprobacion:
  estado: encontrada
  nota: "Ronda automática del 23 nov a las 14:04, con el teletipo de Europa Press de las 9:05 (busca «fortunas superiores a 100 millones»): la cita es del vídeo de Sánchez, entrecomillada por la agencia. La cifra de 2.000 millones y «sin exenciones ni bonificaciones» vienen del comunicado del PSOE que recoge el mismo teletipo (busca «cerrar las vías»); el destino del dinero, de la frase de Sánchez «vivienda protegida, blindar las pensiones y crear una prestación por crianza». Cotejada el 23 nov a las 14:55 en el programa del PSOE (PDF, sha256 e9c83413…): la medida 127 (pág. 48, busca «tributación complementaria») y la 192 (pág. 57) hablan de gravar los grandes patrimonios, pero sin umbral ni recaudación, así que el anuncio queda como fuente principal y el programa como segunda. No duplica «Impulsar un impuesto mínimo global sobre las grandes fortunas» (medida 457), que es de ámbito internacional."
revisadaPor: "Khiustin Tornés"
