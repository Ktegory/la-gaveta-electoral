titulo: "Crear un impuesto a las fortunas de más de 100 millones de euros"
resumen: "Sánchez lo anunció en un vídeo el 23 de noviembre. El PSOE calcula que recaudaría 2.000 millones, que irían a vivienda protegida, pensiones y una prestación por crianza. No ha dicho qué tipo se aplicaría; sí que no tendría exenciones ni bonificaciones. Su programa ya preveía una «tributación complementaria de los grandes patrimonios» para financiar la prestación por crianza, sin fijar un umbral."
fuentes:
  - fuente: "psoe/prensa-impuesto-ultrarricos-2026-11-23"
    cita: "las fortunas superiores a 100 millones de euros tendrán que pagar por lo que les corresponde"
  - fuente: "psoe/programa-29n-2026"
    pagina: "48"
    cita: "La recaudación de la tributación complementaria de los grandes patrimonios y de la mayor progresividad de las rentas del capital contribuirá a financiar la prestación por crianza y la lucha contra la pobreza infantil."
