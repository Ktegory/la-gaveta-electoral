titulo: "Garantizar el acceso a servicios básicos y movilidad en todo el territorio, hacia el «país de los 30 minutos»"
resumen: "El programa no fija el plazo por ley ni detalla qué servicios incluye. En Ahigal (Cáceres), la cabeza de lista por Cáceres lo explicó como que cualquier persona, viva donde viva, pueda acceder a los servicios básicos en un tiempo razonable."
