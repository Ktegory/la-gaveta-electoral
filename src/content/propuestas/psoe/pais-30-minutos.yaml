    pagina: "71"
    cita: "Garantizar el acceso a servicios básicos y soluciones de movilidad en todo el territorio, avanzando hacia el “País de los 30 minutos” para reforzar la igualdad de oportunidades con independencia del lugar de residencia."
  - fuente: "psoe/prensa-pais-30-minutos-2026-11-22"
    cita: "Ese programa, ha añadido, recoge el concepto del \"país de los 30 minutos\", pensado \"para que cualquier persona, viva donde viva, pueda acceder a los servicios básicos en un tiempo razonable y para que vivir en un pueblo no suponga tener menos oportunidades\"."
